<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Phillis Brown's books: short fiction for grown readers. Pick a story from the shelf to read or listen.">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Phillis Brown Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400;500;600&family=Pinyon+Script&display=swap">
<style>
/* Layout: one endless bookshelf on a cream wall that matches Phillis's portrait branding.
   A real book turns out to show its cover, then opens into a full page in the book's own color. */
:root{
  --wall:#F4ECDF;
  --wall-2:#E9DCC7;
  --ink:#1F1613;
  --muted:#7B6A5D;
  --crimson:#B0142F;
  --caramel:#B98A55;
  --wood-hi:#9A6A43;
  --wood:#6B4329;
  --wood-lo:#3E2617;
  --display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --H:300px;
  --spot:rgba(255,250,240,.9);
  --stripe:rgba(120,90,60,.035);
  --f0:#8C6F4E;--f1:#6F7F78;--f2:#7F6A5C;--f3:#9C4F43;--f4:#55606B;--f5:#7A7158;
  color-scheme:light;
}
/* Style previews */
:root[data-style="lounge"]{
  --wall:#1A1219;--wall-2:#0D090C;--ink:#F3E9DC;--muted:#A8968C;--caramel:#C9A25B;
  --spot:rgba(255,196,130,.16);--stripe:rgba(255,255,255,.018);
  --wood-hi:#C9A25B;--wood:#2B2321;--wood-lo:#100C0B;
  --f0:#2E2731;--f1:#3B302B;--f2:#4F1E28;--f3:#2C3335;--f4:#5A4A3A;--f5:#211C1F;
  color-scheme:dark;
}
:root[data-style="red"]{
  --wall:#7A0F1B;--wall-2:#4A0910;--ink:#FCF0E6;--muted:#E6BBB0;--caramel:#D9B26F;
  --spot:rgba(255,170,140,.2);--stripe:rgba(0,0,0,.05);
  --wood-hi:#4A4242;--wood:#171213;--wood-lo:#050404;
  --f0:#2A0A0F;--f1:#1A1414;--f2:#B5884F;--f3:#3D1418;--f4:#E8D9C4;--f5:#5E1019;
  color-scheme:dark;
}
:root[data-style="library"]{
  --wall:#33251B;--wall-2:#1E150F;--ink:#F3E8D6;--muted:#C2AA8C;--caramel:#C9A25B;
  --spot:rgba(255,206,140,.22);--stripe:rgba(0,0,0,.18);
  --wood-hi:#B07C4F;--wood:#6E452A;--wood-lo:#2C1A0E;
  --f0:#3F4D3A;--f1:#6B2A22;--f2:#2D3B4F;--f3:#7A6038;--f4:#4B3A2E;--f5:#5C5A3A;
  color-scheme:dark;
}
:root[data-style="gallery"]{
  --wall:#FBFAF8;--wall-2:#EFEDE9;--ink:#121212;--muted:#7A7672;--caramel:#C8102E;
  --spot:rgba(255,255,255,0);--stripe:rgba(0,0,0,0);
  --wood-hi:#FFFFFF;--wood:#ECEBE7;--wood-lo:#C9C7C1;
  --f0:#E6E1D8;--f1:#CEC8BD;--f2:#1A1A1A;--f3:#BDB6AA;--f4:#D9D3C9;--f5:#8E8A84;
}
:root[data-style="library"] .app{background:
    radial-gradient(70% 55% at 50% 42%, var(--spot), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, rgba(255,255,255,.03) 2px 4px, transparent 4px 180px),
    linear-gradient(var(--wall), var(--wall-2));}
:root[data-style="gallery"] .plank{height:10px;box-shadow:0 1px 0 #fff inset, 0 18px 24px -14px rgba(0,0,0,.25)}
:root[data-style="gallery"] .plank::after{display:none}
:root[data-style="lounge"] .slot.sel .cover,:root[data-style="red"] .slot.sel .cover,:root[data-style="library"] .slot.sel .cover{box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 24px 60px -10px rgba(0,0,0,.8)}
/* Walnut: dark wood-panel wall, spotlight, real shelf, two big books */
:root[data-style="walnut"]{
  --wall:#24160F;--wall-2:#110A06;--ink:#F6ECDF;--muted:#CDB9A4;--caramel:#C9A25B;--gold:#C9A25B;
  --wood-hi:#8C5D38;--wood:#5A3820;--wood-lo:#22130A;
  color-scheme:dark;
}
:root[data-style="walnut"] .app{background:
    radial-gradient(42% 38% at 50% 34%, rgba(255,196,128,.30), rgba(255,170,100,.08) 55%, transparent 75%),
    radial-gradient(130% 95% at 50% 40%, transparent 50%, rgba(0,0,0,.6)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 2px, rgba(255,220,180,.05) 2px 3px, transparent 3px 118px),
    repeating-linear-gradient(90deg, rgba(255,235,210,.022) 0 1px, transparent 1px 6px, rgba(0,0,0,.05) 6px 9px, transparent 9px 17px),
    linear-gradient(#2C1B12, #1A0F09 60%, #100905);}
:root[data-style="walnut"] .side{display:none}
:root[data-style="walnut"] .top{grid-template-columns:1fr;justify-items:center;padding-block:22px 0}
:root[data-style="walnut"] .brand{gap:16px}
:root[data-style="walnut"] .avatar{width:64px;height:64px;box-shadow:0 0 0 2px #1A0F09,0 0 0 4px var(--gold),0 6px 18px rgba(0,0,0,.5)}
:root[data-style="walnut"] .wordmark b{font-size:clamp(34px,4vw,46px);text-shadow:0 2px 10px rgba(0,0,0,.5)}
:root[data-style="walnut"] .wordmark svg{height:6px}
:root[data-style="walnut"] .wordmark small{font-size:11px;letter-spacing:.3em;margin-top:8px}
.chev{display:none}
:root[data-style="walnut"] .chev{display:block;width:20px;height:20px;color:var(--muted);align-self:center;margin-left:-4px}
:root[data-style="walnut"] .track{position:relative;z-index:2;padding-top:40px}
:root[data-style="walnut"] .row{margin:0 auto;padding-inline:24px;gap:14px}
:root[data-style="walnut"] .plank{z-index:1;margin-top:-12px;height:46px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 13px, rgba(255,220,180,.04) 13px 14px, transparent 14px 31px),
    linear-gradient(#8A5B37 0, #6A4327 12px, #3E2614 13px, #4A2E19 22px, #2A180C 100%);
  box-shadow:0 1px 0 rgba(255,210,160,.25) inset, 0 26px 34px -10px rgba(0,0,0,.7)}
:root[data-style="walnut"] .plank::after{display:none}
:root[data-style="walnut"] .slot::after{bottom:-8px;height:16px;left:-10px;right:-10px;background:radial-gradient(closest-side, rgba(0,0,0,.65), transparent)}
:root[data-style="walnut"] .slot.sel{width:calc(var(--d) * .92 + var(--t) * .42 + 30px)}
:root[data-style="walnut"] .slot.sel .book{--ly:-4px;--lz:calc(var(--t) * -.5 + 30px);--ry:-66deg}
:root[data-style="walnut"] .slot.real:hover:not(.sel) .book{--ly:-8px}
:root[data-style="walnut"] .open-hint{display:none}
:root[data-style="walnut"] .spine.paper::before{background:linear-gradient(90deg, rgba(40,25,15,.45) 0%, rgba(255,255,255,.45) 18%, rgba(255,255,255,.1) 48%, rgba(40,25,15,.12) 74%, rgba(40,25,15,.5) 100%)}
:root[data-style="walnut"] .slot.sel .cover{box-shadow:0 0 0 1px rgba(201,162,91,.35), 0 30px 50px -14px rgba(0,0,0,.85)}
.cap-eyebrow{display:none}
:root[data-style="walnut"] .caption{padding-top:30px;gap:10px;min-height:0}
:root[data-style="walnut"] .cap-eyebrow{display:flex;align-items:center;gap:18px;margin:0;font:500 12px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
:root[data-style="walnut"] .cap-eyebrow::before,:root[data-style="walnut"] .cap-eyebrow::after{content:"";width:clamp(40px,10vw,90px);height:1px;background:var(--gold);opacity:.8}
:root[data-style="walnut"] .cap-title{font-size:clamp(30px,3.4vw,40px)}
:root[data-style="walnut"] .cap-meta{font-size:12px;letter-spacing:.22em;color:var(--muted)}
:root[data-style="walnut"] .cap-open{margin-top:12px;border:0;background:linear-gradient(#D21F38,#A80F25);color:#fff;padding:18px 44px;font-size:13px;letter-spacing:.18em;box-shadow:0 10px 24px -8px rgba(200,16,46,.6), inset 0 1px 0 rgba(255,255,255,.25)}
:root[data-style="walnut"] .cap-open:hover{background:linear-gradient(#E0263F,#B5122A);color:#fff}
.dots{display:none}
:root[data-style="walnut"] .dots{display:flex;gap:14px;margin-top:14px}
.dots button{width:14px;height:14px;padding:0;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer}
.dots button[aria-current="true"]{background:#D21F38;border-color:#D21F38}
.dots button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
:root[data-style="walnut"] .foot{display:none}
@media (max-width:640px){:root[data-style="walnut"] .row{gap:10px;padding-inline:16px}}
.styles{padding:4px 16px 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.styles span{margin-right:4px}
.styles button{border:1px solid color-mix(in srgb, var(--ink) 30%, transparent);background:transparent;color:var(--ink);border-radius:99px;padding:6px 11px;cursor:pointer;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.styles button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.styles button:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
html,body{height:100%}
body{
  background:var(--wall);
  color:var(--ink);
  font-family:var(--body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

.app{
  height:100%;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-columns:minmax(0,1fr);
  background:
    radial-gradient(70% 55% at 50% 42%, var(--spot), transparent 70%),
    repeating-linear-gradient(90deg, var(--stripe) 0 1px, transparent 1px 38px),
    linear-gradient(var(--wall), var(--wall-2));
}

/* Header */
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:16px;
  padding-block:16px 6px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.label{
  font:500 11px/1.3 var(--body);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.top .r{justify-self:end;text-align:right}
.brand{
  display:flex;align-items:center;gap:14px;
  background:none;border:0;padding:6px 10px;cursor:pointer;border-radius:999px;
}
.brand:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:url("img/phillis-face.jpg") center/cover, var(--caramel);
  box-shadow:0 0 0 2px var(--wall),0 0 0 3px var(--caramel);
}
.wordmark{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.wordmark b{
  font:400 clamp(30px,3.6vw,42px)/1 var(--script);
  color:var(--ink);
  padding-right:6px;
}
.wordmark svg{width:100%;height:8px;margin-top:-2px}
.wordmark small{
  margin-top:5px;
  font:500 10px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);
}
.brand:hover .wordmark small{color:var(--crimson)}

/* Stage and shelf */
.stage{
  position:relative;
  display:flex;flex-direction:column;justify-content:center;
  min-height:0;min-width:0;
}
.track{
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  padding-top:64px;
  cursor:grab;
  user-select:none;-webkit-user-select:none;
  touch-action:pan-x;
  outline:none;
}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing}
.row{
  position:relative;
  display:flex;align-items:flex-end;gap:3px;
  width:max-content;
  height:calc(var(--H) + 4px);
}
.plank{
  height:26px;
  background:
    linear-gradient(var(--wood-hi) 0 3px, var(--wood) 3px 62%, var(--wood-lo)),
    var(--wood);
  box-shadow:0 2px 0 rgba(255,255,255,.25) inset, 0 22px 28px -12px rgba(60,35,20,.45);
  position:relative;
}
.plank::after{
  content:"";position:absolute;inset:3px 0 0;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 90px, rgba(255,255,255,.05) 90px 92px, transparent 92px 170px);
}

.slot{
  --bh:calc(var(--H) * var(--r));
  --t:calc(var(--H) * var(--k) / 300);
  --d:calc(var(--bh) * .6667);
  position:relative;flex:0 0 auto;
  width:var(--t);height:var(--bh);
  perspective:1400px;
  transition:width .85s cubic-bezier(.2,.75,.2,1);
}
.slot.real{cursor:pointer;outline:none}
/* Keyboard focus: a flat gold outline, since a ring on the tilted 3D cover barely shows */
.slot.real:focus-visible{outline:2px solid var(--gold,#C9A25B);outline-offset:10px;border-radius:6px}
@media (max-width:640px){.slot.real:focus-visible{outline-offset:4px}}
.slot.sel{width:calc(var(--d) + var(--t) * .2 + 40px);z-index:5}
.slot::after{
  content:"";position:absolute;left:-4px;right:-4px;bottom:-5px;height:10px;
  background:radial-gradient(closest-side, rgba(40,20,10,.45), transparent);
  pointer-events:none;
}
.book{
  --ly:0px;--lz:calc(var(--d) * -.5);--ry:0deg;
  position:absolute;left:50%;bottom:0;
  width:var(--t);height:var(--bh);
  transform-style:preserve-3d;
  transform:translateX(-50%) translateY(var(--ly)) translateZ(var(--lz)) rotateY(var(--ry));
  transition:transform .9s cubic-bezier(.2,.75,.2,1);
}
.slot.real:hover .book{--ly:-10px}
.slot.sel .book{--ly:-24px;--lz:calc(var(--t) * -.5 + 44px);--ry:-80deg}
.slot.lifted .book{visibility:hidden}
.row.noanim .slot,.row.noanim .book{transition:none}

*,*::before,*::after{box-sizing:border-box}
.face{position:absolute;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.spine{
  left:0;width:var(--t);height:var(--bh);
  transform:translateZ(calc(var(--d) * .5));
  background:var(--c);
  color:var(--acc,#E7D6B4);
  border-radius:2px 2px 1px 1px;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--t) * .38) 0 calc(var(--t) * .3);
  overflow:hidden;
}
.spine::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg, rgba(0,0,0,.42) 0%, rgba(255,255,255,.14) 20%, rgba(255,255,255,.04) 46%, rgba(0,0,0,.06) 72%, rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}
.spine.fill{filter:saturate(.75)}
.spine.paper{color:#141012;padding:calc(var(--t) * .34) 0 calc(var(--t) * .28)}
.spine.paper::before{
  background:
    linear-gradient(90deg, rgba(60,40,30,.28) 0%, rgba(255,255,255,.5) 22%, rgba(255,255,255,.1) 50%, rgba(60,40,30,.06) 74%, rgba(60,40,30,.3) 100%);
}
.spine.paper .sp-mark{width:34%;height:3px;border-radius:2px;background:var(--red)}
.spine.paper .sp-auth{writing-mode:vertical-rl;white-space:nowrap;font:600 calc(var(--t) * .17)/1 var(--body);letter-spacing:.24em}
.spine.paper .sp-title{font-size:calc(var(--t) * .4);letter-spacing:.02em;text-transform:none;display:flex;align-items:center;font-variation-settings:"opsz" 6}
.spine.paper .sp-title em{font-style:italic;font-weight:400}
.spine.paper .sp-title .red{color:var(--red);margin-inline:.28em}
.spine.paper .sp-title b{
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  margin-inline-start:.3em;padding-inline:.35em;
  background:linear-gradient(var(--red),var(--red)) center/78% 100% no-repeat;
  -webkit-mask:linear-gradient(transparent, #000 6%, #000 94%, transparent);
          mask:linear-gradient(transparent, #000 6%, #000 94%, transparent);
}
.band{position:absolute;left:0;right:0;height:2px;background:rgba(222,190,120,.6);box-shadow:0 5px 0 rgba(222,190,120,.45)}
.band.t{top:9%}
.band.b{bottom:11%}
.sp-mark{position:relative;font:italic 500 calc(var(--t) * .3)/1 var(--display);letter-spacing:.02em}
.sp-title{
  position:relative;margin:auto 0;
  writing-mode:vertical-rl;
  font:500 calc(var(--t) * .36)/1 var(--display);
  letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
}
.sp-title i{font-style:italic;text-transform:none;letter-spacing:.04em;font-size:.72em;margin-top:.6em}
.sp-auth{position:relative;font:600 calc(var(--t) * .16)/1 var(--body);letter-spacing:.2em;text-transform:uppercase}

.cover{
  width:var(--d);height:var(--bh);
  left:calc((var(--t) - var(--d)) / 2);
  transform:rotateY(90deg) translateZ(calc(var(--t) * .5));
  background:var(--c);
  overflow:hidden;border-radius:1px 3px 3px 1px;
  container-type:size;
  box-shadow:0 18px 40px -16px rgba(40,20,10,.55);
}
.cover img,.d-cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover::after,.d-cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,.32), rgba(255,255,255,.14) 2.4%, transparent 6%, transparent 95%, rgba(0,0,0,.12));
}
.open-hint{
  position:absolute;right:8%;bottom:6%;
  font:600 3.6cqw/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
  padding:3cqw 4cqw;border-radius:99px;
  background:rgba(255,255,255,.9);color:#1F1613;
  opacity:0;transition:opacity .4s .5s;z-index:2;
}
.slot.sel .open-hint{opacity:1}

/* Reading progress on the spine */
.sp-prog{position:absolute;left:0;bottom:0;width:3px;height:calc(var(--p,0) * 100%);background:var(--red);box-shadow:0 0 6px rgba(200,16,46,.5)}

/* Props on the shelf */
.slot.prop{width:calc(var(--H) * var(--w));height:calc(var(--H) * var(--ph));perspective:none}
.slot.prop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slot.prop-g::after,.slot.prop-glass::after,.slot.prop-rose::after{display:none}
.slot.prop-glass::before,.slot.prop-rose::before{content:"";position:absolute;left:10%;right:10%;bottom:-3px;height:6px;background:radial-gradient(closest-side, rgba(40,20,10,.35), transparent)}
.mirror{position:absolute;inset:0;transform:scaleX(-1)}
.prop-endL{margin-right:-1px}.prop-endR{margin-left:-1px}
.prop-candle .jar{position:absolute;left:12%;right:12%;bottom:0;height:72%;border-radius:10% 10% 14% 14%/8% 8% 12% 12%;
  background:linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 30%, rgba(255,255,255,.08) 70%, rgba(255,255,255,.4));
  box-shadow:inset 0 0 0 1px rgba(80,60,50,.25)}
.prop-candle .wax{position:absolute;left:5%;right:5%;bottom:4%;height:74%;border-radius:0 0 12% 12%;background:linear-gradient(#F6EFE3,#E9DCC7)}
.prop-candle .label{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font:italic 600 calc(var(--H) * .045)/1 var(--display);color:#B0142F;letter-spacing:.04em}
.prop-candle .wick{position:absolute;left:50%;bottom:58%;width:2px;height:7%;background:#2a201c;transform:translateX(-50%)}
.prop-candle .flame{position:absolute;left:50%;bottom:63%;width:16%;height:30%;margin-left:-8%;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
  background:radial-gradient(50% 70% at 50% 72%, #fff 0 18%, #FFE29A 30%, #FFB347 58%, rgba(255,120,40,0) 75%);
  transform-origin:50% 90%;animation:flick 2.6s ease-in-out infinite}
.prop-candle .glow{position:absolute;left:50%;bottom:40%;width:calc(var(--H) * .9);height:calc(var(--H) * .9);transform:translate(-50%,50%);
  background:radial-gradient(closest-side, rgba(255,196,120,.38), rgba(255,196,120,.12) 45%, transparent);pointer-events:none;animation:glow 3.4s ease-in-out infinite}

const root = document.documentElement;
const stage = $("#stage"), track = $("#track"), row = $("#row");
const capTitle = $("#capTitle"), capMeta = $("#capMeta"), capOpen = $("#capOpen"), counter = $("#counter");
const detail = $("#detail"), ink = $("#ink"), dText = $("#dText"), dCover = $("#dCover"), dInner = $("#dInner"), backBtn = $("#back");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function drawnCover(b){
  if (b.id === "reign-is-mine") return `<div class="fc fc-reign"><span class="fc-kicker">${esc(b.kicker)}</span><div class="fc-title">Reign<em>is Mine</em></div><span class="fc-rule"></span><span class="fc-author">Phillis Brown</span></div>`;
  return `<div class="fc fc-ebony"><span class="fc-kicker">Coming Soon</span><div class="fc-title">${esc(b.title)}${b.subtitle?`<em>${esc(b.subtitle)}</em>`:""}</div><span class="fc-rule"></span><span class="fc-author">Phillis Brown</span></div>`;
}
const coverHTML = b => b.cover ? `<img src="${esc(b.cover)}" alt="Cover of ${esc(b.title)}${b.subtitle ? " " + esc(b.subtitle) : ""} by Phillis Brown" draggable="false">` : drawnCover(b);

function buildShelf(){
  const frag = document.createDocumentFragment();
  for (let s = 0; s < SETS; s++){
    const r = rng(4100 + (s % JUMP) * 97);
    for (const code of SET_LAYOUT){
      const el = document.createElement("div");
      if (code[0] === "B"){
        const i = +code[1], b = BOOKS[i], sp = b.spine;
        el.className = "slot real";
        el.dataset.book = i;
        el.tabIndex = -1;
        el.setAttribute("role","button");
        el.setAttribute("aria-label", `${b.title}${b.subtitle?": "+b.subtitle:""} by Phillis Brown`);
        el._k = sp.k; el._r = sp.r;
        el.style.cssText = `--k:${sp.k};--r:${sp.r}`;
        el.innerHTML =
          `<span class="book" style="--c:${sp.color};--red:${sp.red}">`+
            `<span class="face spine paper">`+
              `<span class="sp-mark"></span>`+
              `<span class="sp-title">${sp.html}</span>`+
              `<span class="sp-auth">Brown</span><span class="sp-prog"></span></span>`+
            `<span class="face cover"></span>`+
          `</span>`;
      } else if (code[0] === "P" || code === "g"){
        const name = code === "g" ? "g" : code.slice(2), pr = PROPS[name];
        el.className = `slot prop prop-${name}`;
        el._k = pr.w * 300; el._r = pr.h;
        el.style.cssText = `--w:${pr.w};--ph:${pr.h}`;
        el.innerHTML = propHTML(name);
        if (name === "frame"){
          el.setAttribute("role","button");
          el.tabIndex = -1;
          el.setAttribute("aria-label","About Phillis Brown");
        } else el.setAttribute("aria-hidden","true");
      } else {
        const k = 20 + Math.round(r() * 22), h = +(0.8 + r() * 0.17).toFixed(3);
        const c = code.startsWith("s:") ? code.slice(2) : `var(--f${Math.floor(r() * 6)})`, bands = !code.startsWith("s:") && r() < .5;
        el.className = "slot filler";
        el.setAttribute("aria-hidden","true");
        el._k = k; el._r = h;
        el.style.cssText = `--k:${k};--r:${h}`;
        el.innerHTML = `<span class="book"><span class="face spine fill" style="--c:${c}">${bands?'<i class="band t"></i><i class="band b"></i>':""}</span></span>`;
      }
      frag.appendChild(el);
    }
  }
  row.appendChild(frag);
}

/* ---------- Sizing and endless wrap ---------- */
let H = 300, setW = 0, sel = null;
const restW = s => H * s._k / 300;
const selW = s => root.dataset.style === "walnut" ? H * s._r * .6667 * .92 + restW(s) * .42 + 30 : H * s._r * .6667 + restW(s) * .2 + 40;

function sizeShelf(){
  const cap = $(".caption").offsetHeight;
  const avail = stage.clientHeight - cap - 64 - 26 - 24;
  let maxH = 360;
  if (root.dataset.style === "walnut"){
    // keep every book on screen: picked cover + the other spines must fit the width
    const ks = BOOKS.map(x => x.spine.k), kMax = Math.max(...ks), kSum = ks.reduce((p, q) => p + q, 0);
    const fixed = 2 * (innerWidth <= 640 ? 16 : 24) + 14 * (BOOKS.length - 1) + 30;
    const perH = .6667 * .92 + kMax * .42 / 300 + (kSum - kMax) / 300;
    // tall screens (tablets, big monitors) let books grow past 440px instead of leaving empty wall
    maxH = Math.min(innerHeight > 1000 ? 640 : 440, (track.clientWidth - fixed) / perH);
  }
  H = Math.round(Math.max(170, Math.min(maxH, avail)));
  root.style.setProperty("--H", H + "px");
  const n = SET_LAYOUT.length;
  const ref = row.children[n * JUMP];
  setW = ref ? ref.offsetLeft - row.children[0].offsetLeft : 0;
}

function instant(fn){
  row.classList.add("noanim");
  fn();
  void row.offsetWidth;
  row.classList.remove("noanim");
}

let drag = null, moved = false;
function wrap(){
  if (!setW) return;
  const sl = track.scrollLeft, unit = setW;              // unit = JUMP sets
  const lo = unit * .5, hi = row.scrollWidth - track.clientWidth - unit * .5;
  let shift = 0;
  if (sl < lo) shift = unit; else if (sl > hi) shift = -unit;
  if (!shift) return;
  const step = SET_LAYOUT.length * JUMP * Math.sign(shift);
  instant(() => {
    if (sel){
      const idx = [...row.children].indexOf(sel) + step;
      const next = row.children[idx];
      if (next){ const old = sel; ensureCover(next); old.classList.remove("sel"); next.classList.add("sel"); sel = next; dropCover(old); }
    }
    track.scrollLeft = sl + shift;
  });
  if (drag) drag.sl += shift;
}
track.addEventListener("scroll", wrap, {passive:true});

/* ---------- Where each reader left off (saved by the reader pages) ---------- */
function posOf(b){
  if (!b || !b.progressKey) return 0;
  let p = 0;
  try { p = parseFloat(localStorage.getItem(b.progressKey)) || 0; } catch(_) {}
  return p > 5 ? Math.min(p, b.duration) : 0;
}
const mins = s => Math.max(1, Math.round(s / 60));
function refreshProgress(){
  for (const slot of realSlots()){
    const b = bookOf(slot);
    slot.style.setProperty("--p", (posOf(b) / b.duration).toFixed(3));
  }
  setCaption(sel ? bookOf(sel) : null);
}

/* ---------- Selection ---------- */
function bookOf(slot){ return slot ? BOOKS[+slot.dataset.book] : null }

function setCaption(b){
  if (!b){
    capTitle.innerHTML = "Pick a book";
    capMeta.textContent = "Phillis Brown";
    capOpen.hidden = true;
    return;
  }
  capTitle.innerHTML = esc(b.title) + (b.subtitle ? ` <i>${esc(b.subtitle)}</i>` : "");
  const pos = posOf(b);
  capMeta.textContent = pos ? `${b.capline} · ${mins(pos)} of ${mins(b.duration)} min in` : b.capline;
  capOpen.hidden = !sel;
  counter.textContent = String(BOOKS.indexOf(b) + 1).padStart(2,"0") + " / " + String(BOOKS.length).padStart(2,"0");
  document.querySelectorAll("#dots button").forEach((d, i) => d.setAttribute("aria-current", String(+d.dataset.i === BOOKS.indexOf(b))));
}

function select(slot, opts = {}){
  if (sel === slot) return;
  const prev = sel;
  let corr = 0;
  const run = () => {
    if (prev){
      if (slot && (prev.compareDocumentPosition(slot) & Node.DOCUMENT_POSITION_FOLLOWING))
        corr = prev.getBoundingClientRect().width - restW(prev);
      prev.classList.remove("sel");
      prev.tabIndex = -1;
    }
    sel = slot;
    if (prev) setTimeout(() => dropCover(prev), 950);
    if (slot){
      ensureCover(slot);
      slot.classList.add("sel");
      slot.tabIndex = 0;
      const left = slot.offsetLeft - corr + selW(slot) / 2 - track.clientWidth / 2;
      track.scrollTo({left, behavior: (opts.instant || reduce) ? "auto" : "smooth"});
    }
  };
  opts.instant ? instant(run) : run();
  setCaption(bookOf(slot));
}

/* Only the picked book carries its cover picture (keeps phones from running out of memory) */
function ensureCover(slot){
  if (!slot || !slot.classList.contains("real")) return;
  const face = slot.querySelector(".cover");
  if (face.firstChild) return;
  const b = bookOf(slot);
  face.innerHTML = (b.coverSm ? `<img src="${esc(H > 440 ? b.cover : b.coverSm)}" alt="" draggable="false" decoding="async">` : drawnCover(b)) + `<span class="open-hint">Open</span>`;
}
function dropCover(slot){
  if (slot && slot !== sel && slot !== openSlot) slot.querySelector(".cover").replaceChildren();
}
function realSlots(){ return [...row.querySelectorAll(".slot.real")] }
function step(dir){
  const all = realSlots();
  if (!sel){ select(nearestReal()); return; }
  const i = all.indexOf(sel) + dir;
  if (all[i]) { select(all[i]); all[i].focus({preventScroll:true}); }
}
function nearestReal(){
  const mid = track.scrollLeft + track.clientWidth / 2;
  let best = null, bd = Infinity;
  for (const s of realSlots()){ const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid); if (d < bd){ bd = d; best = s; } }
  return best;
}

/* ---------- Pointer, wheel, keys ---------- */
track.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  drag = {x:e.clientX, sl:track.scrollLeft}; moved = false;
});
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!moved && Math.abs(dx) > 5){ moved = true; track.classList.add("dragging"); }
  if (moved) track.scrollLeft = drag.sl - dx;
});
addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null; track.classList.remove("dragging");
  setTimeout(() => { moved = false }, 0);
});
stage.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ track.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive:false});

track.addEventListener("click", e => {
  if (moved) return;
  const frame = e.target.closest(".prop-frame");
  if (frame){ openAuthor({}, frame.querySelector(".frame")); return; }
  const slot = e.target.closest(".slot.real");
  if (!slot){ select(null); return; }
  if (slot === sel) openBook(slot); else select(slot);
});
track.addEventListener("mouseover", e => {
  if (sel) return;
  const slot = e.target.closest(".slot.real");
  setCaption(bookOf(slot));
});
track.addEventListener("mouseleave", () => { if (!sel) setCaption(null) });
capOpen.addEventListener("click", () => sel && openBook(sel));

addEventListener("keydown", e => {
  if (!detail.hidden){ if (e.key === "Escape") closePage(); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.classList.contains("real")){
    e.preventDefault();
    const s = document.activeElement; s === sel ? openBook(s) : select(s);
  }
  else if (e.key === "Escape") select(null);
});

/* ---------- The page that unfolds ---------- */
let openSlot = null, openSrc = null, busy = false;

function setInk(x, y, r){
  const g = `radial-gradient(circle at ${x}px ${y}px, #000 ${Math.max(0, r - 110)}px, transparent ${Math.max(0, r)}px)`;
  ink.style.webkitMaskImage = g; ink.style.maskImage = g;
}
function animateInk(x, y, from, to, ms){
  return new Promise(done => {
    const t0 = performance.now();
    const ease = t => to > from ? 1 - Math.pow(1 - t, 3) : t * t * (3 - 2 * t);
    (function frame(now){
      const t = Math.min(1, (now - t0) / ms);
      setInk(x, y, from + (to - from) * ease(t));
      t < 1 ? requestAnimationFrame(frame) : done();
    })(t0);
  });
}
function flip(src, dst){
  return `translate(${src.left - dst.left}px, ${src.top - dst.top}px) scale(${src.width / dst.width}, ${src.height / dst.height})`;
}
function reach(x, y){ return Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 140 }

function paintPage(p){
  detail.style.setProperty("--dbg", p.bg);
  detail.style.setProperty("--dink", p.ink);
  detail.style.setProperty("--dacc", p.acc);
}

function fillBook(b){
  paintPage(b.page);
  dCover.style.setProperty("--dar", String(1024 / 1536));
  dCover.innerHTML = coverHTML(b);
  const blurb = b.blurb.map(p => typeof p === "string" ? `<p>${esc(p)}</p>` : `<p class="pull">${esc(p.pull)}</p>`).join("");
  const pos = posOf(b);
  const readBtn = b.read
    ? `<a class="buy read" href="${esc(b.read)}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5.5c3-1.3 6-1.3 9 .8 3-2.1 6-2.1 9-.8V19c-3-1.3-6-1.3-9 .8-3-2.1-6-2.1-9-.8z"/><path d="M12 6.3V19.8"/></svg>${pos ? `Continue · ${mins(pos)} of ${mins(b.duration)} min` : "Read or listen"}</a>`
    : "";
  const cta = readBtn + (b.amazon
    ? `<a class="buy${b.read ? " is-soon" : ""}" href="${esc(b.amazon)}" target="_blank" rel="noopener">Buy on Amazon</a>`
    : `<span class="buy is-soon" role="note">${esc(b.soon)}</span>`);
  dText.innerHTML =
    `<p class="d-eyebrow">${esc(b.kicker === "Phillis Brown" ? "By Phillis Brown" : b.kicker + " · By Phillis Brown")}</p>`+
    `<h2 class="d-title" id="dTitle">${esc(b.title)}</h2>`+
    (b.subtitle ? `<p class="d-sub">${esc(b.subtitle)}</p>` : `<p class="d-sub" hidden></p>`)+
    `<ul class="d-meta">${b.meta.map(m => `<li>${esc(m)}</li>`).join("")}</ul>`+
    `<div class="d-blurb">${blurb}</div>`+
    (b.note ? `<details class="d-note"><summary>Content note</summary><p>${esc(b.note)}</p></details>` : `<div hidden></div>`)+
    `<div class="d-cta">${cta}</div>`+
    (pos ? `<div class="d-prog"><span class="bar"><i style="width:${(pos / b.duration * 100).toFixed(1)}%"></i></span><button type="button" class="restart" data-restart="${esc(b.id)}">Start over</button></div>` : `<div hidden></div>`);
}

function fillAuthor(){
  paintPage(AUTHOR.page);
  dCover.style.setProperty("--dar", String(1024 / 1536));
  dCover.innerHTML = `<img src="${AUTHOR.photo}" alt="Phillis Brown smiling, beside a curly-haired doll in a yellow cardigan">`;
  const list = BOOKS.map((b, i) => `<li><button type="button" class="buy is-soon" data-goto="${i}">${esc(b.title)}${b.subtitle ? ": " + esc(b.subtitle) : ""}</button></li>`).join("");
  dText.innerHTML =
    `<p class="d-eyebrow">About the author</p>`+
    `<h2 class="d-title script" id="dTitle">Phillis Brown</h2>`+
    `<p class="d-sub">Stories for grown readers, and stories told with dolls.</p>`+
    `<div class="d-blurb"><p>Phillis Brown writes steamy, twisty short fiction about desire, envy and the women caught up in both. Away from the page she tells stories with her dolls, staging scenes and characters one photograph at a time.</p></div>`+
    `<ul class="d-meta"><li>Books on the shelf</li></ul>`+
    `<ul class="d-cta" style="list-style:none;padding:0;margin-top:14px">${list}</ul>`;
}

function show(srcRect, ms){
  setInk(0, 0, 0);
  detail.hidden = false;
  dInner.scrollTop = 0;
  const cx = srcRect.left + srcRect.width / 2, cy = srcRect.top + srcRect.height / 2;
  if (reduce || ms === 0){
    setInk(cx, cy, reach(cx, cy) + 400);
    detail.classList.add("shown");
    if (ms !== 0) backBtn.focus({preventScroll:true});
    return Promise.resolve();
  }
  busy = true;
  const dst = dCover.getBoundingClientRect();
  dCover.animate([{transform:flip(srcRect, dst)},{transform:"none"}], {duration:ms, easing:"cubic-bezier(.22,.9,.24,1)"});
  setTimeout(() => detail.classList.add("shown"), ms * .4);
  return animateInk(cx, cy, 0, reach(cx, cy), ms).then(() => {
    busy = false; backBtn.focus({preventScroll:true});
  });
}

function setHash(id){
  try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); }
  catch(_) { if (id) location.hash = id; }
}

function openBook(slot, opts = {}){
  if (busy) return;
  const b = bookOf(slot);
  fillBook(b);
  openSlot = slot; openSrc = null;
  const src = slot.querySelector(".cover").getBoundingClientRect();
  slot.classList.add("lifted");
  setHash(b.id);
  show(src, opts.instant ? 0 : 950);
}

function openAuthor(opts = {}, fromEl){
  if (busy) return;
  fillAuthor();
  openSlot = null; openSrc = fromEl || $(".avatar");
  setHash(AUTHOR.id);
  show(openSrc.getBoundingClientRect(), opts.instant ? 0 : 950);
}

function closePage(){
  if (busy || detail.hidden) return;
  const slot = openSlot, srcEl = slot ? slot.querySelector(".cover") : openSrc;
  const src = srcEl.getBoundingClientRect();
  const dst = dCover.getBoundingClientRect();
  const cx = src.left + src.width / 2, cy = src.top + src.height / 2;
  const finish = () => {
    detail.hidden = true;
    detail.classList.remove("shown");
    dCover.getAnimations().forEach(a => a.cancel());
    if (slot){ slot.classList.remove("lifted"); slot.focus({preventScroll:true}); }
    else $("#brand").focus({preventScroll:true});
    openSlot = null; busy = false;
    setHash("");
  };
  if (reduce){ finish(); return; }
  busy = true;
  detail.classList.remove("shown");
  dCover.animate([{transform:"none"},{transform:flip(src, dst)}], {duration:760, easing:"cubic-bezier(.55,0,.2,1)", fill:"forwards"});
  animateInk(cx, cy, reach(cx, cy), 0, 760).then(finish);
}

backBtn.addEventListener("click", closePage);
dText.addEventListener("click", e => {
  const r = e.target.closest("[data-restart]");
  if (!r) return;
  const b = BOOKS.find(x => x.id === r.dataset.restart);
  try { localStorage.removeItem(b.progressKey); } catch(_) {}
  location.href = b.read;
});
addEventListener("pageshow", () => { refreshProgress(); if (openSlot && !detail.hidden) fillBook(bookOf(openSlot)), detail.classList.add("shown"); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshProgress(); });
addEventListener("storage", refreshProgress);
$("#brand").addEventListener("click", () => openAuthor());
dText.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (!g) return;
  const i = +g.dataset.goto;
  const target = realSlots().find(s => +s.dataset.book === i && s.offsetLeft > setW * 2) || realSlots().find(s => +s.dataset.book === i);
  const finishSwap = () => { select(target, {instant:true}); requestAnimationFrame(() => openBook(target)); };
  // close the author page, then open the book
  if (busy) return;
  closePage();
  setTimeout(finishSwap, reduce ? 0 : 800);
});

/* ---------- Start ---------- */
function midCopy(i){ const c = realSlots().filter(s => +s.dataset.book === i); return c[Math.floor(c.length / 2)]; }
function routeFromHash(){
  const id = (location.hash || "").slice(1);
  if (!id) return;
  if (id === AUTHOR.id){ if (detail.hidden) openAuthor({instant:true}); return; }
  const i = BOOKS.findIndex(b => b.id === id);
  if (i < 0) return;
  const target = midCopy(i);
  if (!detail.hidden) return;
  select(target, {instant:true});
  openBook(target, {instant:true});
}

/* Dots under the button: one per book */
$("#dots").innerHTML = SET_LAYOUT.filter(c => c[0] === "B").map(c => +c[1]).map(i => [BOOKS[i], i]).map(([b, i]) => `<button type="button" data-i="${i}" aria-label="${esc(b.title)}${b.subtitle ? ": " + esc(b.subtitle) : ""}"></button>`).join("");
$("#dots").addEventListener("click", e => { const d = e.target.closest("button"); if (d) select(midCopy(+d.dataset.i)); });

/* Style preview switcher (remembered on this device) */
function applyStyle(name){
  if (name === "cream" || !name) delete root.dataset.style; else root.dataset.style = name;
  document.querySelectorAll("#styles button").forEach(b => b.setAttribute("aria-pressed", String((root.dataset.style || "cream") === b.dataset.style)));
  try { localStorage.setItem("pb-style", name || "cream"); } catch(_) {}
}
$("#styles").addEventListener("click", e => { const b = e.target.closest("button"); if (b) applyStyle(b.dataset.style); });
let savedStyle = "cream";
try { savedStyle = localStorage.getItem("pb-style") || "cream"; } catch(_) {}
applyStyle("walnut");

buildShelf();
refreshProgress();
sizeShelf();
const first = midCopy(0);
select(first, {instant:true});
routeFromHash();
addEventListener("hashchange", routeFromHash);

let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    sizeShelf();
    if (sel) instant(() => { track.scrollLeft = sel.offsetLeft + selW(sel) / 2 - track.clientWidth / 2; });
  }, 120);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sizeShelf(); if (sel) track.scrollLeft = sel.offsetLeft + selW(sel) / 2 - track.clientWidth / 2; });
</script>

</body>
</html>
