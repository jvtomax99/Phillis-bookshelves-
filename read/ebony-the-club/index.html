const PARAS = [{"who": "", "sents": [{"text": "Ebony. The Club.", "v": "F", "t": 0.0, "e": 1.216}]}, {"who": "", "sents": [{"text": "Ebony’s sitting comfortably in her living room, lights off, feet up on the sofa watching television, enjoying her day off from work when her phone rings, it’s Raven.", "v": "F", "t": 1.866, "e": 11.594}]}, {"who": "Raven", "sents": [{"text": "Hey Ebony! ", "v": "F", "t": 12.244, "e": 13.183}, {"text": "What’s up?", "v": "F", "t": 13.333, "e": 14.165}]}, {"who": "Ebony", "sents": [{"text": "Nothing much, glad it’s Friday.", "v": "F", "t": 14.815, "e": 16.692}]}, {"who": "Raven", "sents": [{"text": "What are you doing tonight? ", "v": "F", "t": 17.342, "e": 18.643}, {"text": "I was talking to Scarlett and we were thinking about going to “Limelight” around 10p but meet up for some drinks first, maybe at my house or Scarlett’s. ", "v": "F", "t": 18.793, "e": 28.052}, {"text": "Charli and Micah will meet us there. ", "v": "F", "t": 28.202, "e": 30.314}, {"text": "Jericho and Reign can't make it. ", "v": "F", "t": 30.464, "e": 32.235}, {"text": "You want to roll?", "v": "F", "t": 32.385, "e": 33.409}]}, {"who": "Ebony", "sents": [{"text": "Sure! ", "v": "F", "t": 34.059, "e": 34.72}, {"text": "That sounds good, I haven't been to that club in awhile. ", "v": "F", "t": 34.87, "e": 37.771}, {"text": "Let’s meet at Scarlett's. ", "v": "F", "t": 37.921, "e": 39.265}, {"text": "She's closer and no offense she makes her drinks stronger than yours, she says laughing.", "v": "F", "t": 39.415, "e": 44.194}]}, {"who": "Raven", "sents": [{"text": "You're nothing but a lush because my drinks are the bomb! ", "v": "F", "t": 44.844, "e": 47.617}, {"text": "Raven says jokingly. ", "v": "F", "t": 47.767, "e": 49.239}, {"text": "Okay, so I’ll let Scarlett know we’ll meet at her place at 8:00p.", "v": "F", "t": 49.389, "e": 53.293}]}, {"who": "Ebony", "sents": [{"text": "Alright, see you then.", "v": "F", "t": 53.943, "e": 55.223}]}, {"who": "", "sents": [{"text": "They hung up, both with renewed energy. ", "v": "F", "t": 55.873, "e": 58.049}, {"text": "Ebony was trying to decide what to wear when her phone rang again. ", "v": "F", "t": 58.199, "e": 61.549}, {"text": "This time it’s Cree. ", "v": "F", "t": 61.699, "e": 62.893}, {"text": "She has been hooking up with him for a few weeks.", "v": "F", "t": 63.043, "e": 65.241}]}, {"who": "Ebony", "sents": [{"text": "Well hello there, she answers seductively, her voice a low whisper.", "v": "F", "t": 65.891, "e": 69.539}]}, {"who": "Cree", "sents": [{"text": "Hi beautiful. ", "v": "M", "t": 70.389, "e": 71.903}, {"text": "I’ve been thinking about you all day. ", "v": "M", "t": 72.053, "e": 74.507}, {"text": "Can I come over tonight?", "v": "M", "t": 74.657, "e": 76.555}]}, {"who": "Ebony", "sents": [{"text": "Ebony loves his deep timbre, it warms her lower region immediately. ", "v": "F", "t": 77.405, "e": 81.395}, {"text": "Just hearing this man talk turns her on! ", "v": "F", "t": 81.545, "e": 83.721}, {"text": "Her panties are already getting wet. ", "v": "F", "t": 83.871, "e": 85.876}, {"text": "Uhm…she says hesitantly.", "v": "F", "t": 86.026, "e": 87.711}]}, {"who": "Cree", "sents": [{"text": "What you have plans already?", "v": "M", "t": 88.561, "e": 90.631}]}, {"who": "Ebony", "sents": [{"text": "Nothing that can’t be broken. ", "v": "F", "t": 91.481, "e": 93.081}, {"text": "Sure, come through!", "v": "F", "t": 93.231, "e": 94.319}]}, {"who": "Cree", "sents": [{"text": "Okay, I’ll be there as soon as I get off work. ", "v": "M", "t": 95.169, "e": 98.198}, {"text": "Want pizza or something?", "v": "M", "t": 98.348, "e": 100.396}]}, {"who": "Ebony", "sents": [{"text": "Anything’s good. ", "v": "F", "t": 101.246, "e": 102.291}, {"text": "Call me when you are on your way.", "v": "F", "t": 102.441, "e": 104.041}]}, {"who": "Cree", "sents": [{"text": "Will do baby girl, see you soon.", "v": "M", "t": 104.891, "e": 107.238}]}, {"who": "", "sents": [{"text": "Ebony is dreading calling Raven back, she doesn't want to hear her lip talk, she could be so bossy and judgemental sometimes! ", "v": "F", "t": 108.088, "e": 115.384}, {"text": "But, I want to see Cree, I could use some lovin’ she laughs to herself. ", "v": "F", "t": 115.534, "e": 119.289}, {"text": "Picking up the phone she dials Raven.", "v": "F", "t": 119.439, "e": 121.465}]}, {"who": "Ebony", "sents": [{"text": "Raven, I’m bailing out on you girls. ", "v": "F", "t": 122.115, "e": 124.249}, {"text": "Cree is coming over and a sister needs some good loving! ", "v": "F", "t": 124.399, "e": 127.407}, {"text": "I’ll catch y’all on the rebound.", "v": "F", "t": 127.557, "e": 129.157}]}, {"who": "Raven", "sents": [{"text": "Alright, I understand, get it girl! ", "v": "F", "t": 129.807, "e": 131.812}, {"text": "We’ll talk tomorrow.", "v": "F", "t": 131.962, "e": 133.221}]}, {"who": "Ebony", "sents": [{"text": "That was unexpectedly easy, she thinks to herself. ", "v": "F", "t": 133.871, "e": 136.793}, {"text": "“Thanks, have fun!”", "v": "F", "t": 136.943, "e": 138.074}]}, {"who": "", "sents": [{"text": "Ebony hangs up with Raven and prepares for her evening with Cree. ", "v": "F", "t": 138.724, "e": 142.415}, {"text": "She takes her shower and throws on a sweatsuit. ", "v": "F", "t": 142.565, "e": 145.039}, {"text": "He doesn't care what she's wearing as long as he gets some. ", "v": "F", "t": 145.189, "e": 147.877}, {"text": "She makes note of the time, it’s 6:30p, he should be arriving soon. ", "v": "F", "t": 148.027, "e": 152.465}, {"text": "She put some beer in the refrigerator to chill and sat down to watch the news while waiting for him. ", "v": "F", "t": 152.615, "e": 157.969}, {"text": "Ebony stirred, awakening, she had dozed off, the room was now dark, 3 hours had passed. ", "v": "F", "t": 158.119, "e": 163.453}, {"text": "Wow! ", "v": "F", "t": 163.603, "e": 164.264}, {"text": "It’s 9:30p. ", "v": "F", "t": 164.414, "e": 165.865}, {"text": "She turned the television off and picked up her cell phone to see if there were any messages from Cree. ", "v": "F", "t": 166.015, "e": 171.497}, {"text": "There were no text or voice messages from him. ", "v": "F", "t": 171.647, "e": 174.207}, {"text": "That’s weird she thinks to herself, dialing his number, I hope he’s okay.", "v": "F", "t": 174.357, "e": 178.453}]}, {"who": "", "sents": [{"text": "Ebony has called Cree’s cell phone non-stop for hours. ", "v": "F", "t": 179.103, "e": 182.047}, {"text": "She’s so nervous and worried. ", "v": "F", "t": 182.197, "e": 183.776}, {"text": "It’s not like him to not call if he had changed his mind. ", "v": "F", "t": 183.926, "e": 187.147}, {"text": "Yet, she anxiously waited to hear from him all night. ", "v": "F", "t": 187.297, "e": 189.9}, {"text": "It was already 1:00am. ", "v": "F", "t": 190.05, "e": 191.543}, {"text": "She was going through all the emotions, first worried, then angry and back to worrying. ", "v": "F", "t": 191.693, "e": 196.621}, {"text": "She couldn't take it any longer and called Raven. ", "v": "F", "t": 196.771, "e": 199.289}, {"text": "When Raven answered, she couldn't hold back and started talking fast, crying “Raven, I’m so worried about Cree, he never showed up and that’s not like him, I think something has happened to him”.", "v": "F", "t": 199.439, "e": 209.892}]}, {"who": "Raven", "sents": [{"text": "Ebony! ", "v": "F", "t": 210.542, "e": 211.267}, {"text": "Ebony! ", "v": "F", "t": 211.417, "e": 212.143}, {"text": "Calm down, we were just getting ready to call you to get your butt down here because Mr. Cree is here with someone!", "v": "F", "t": 212.293, "e": 218.159}]}, {"who": "Ebony", "sents": [{"text": "Sniffling, what? ", "v": "F", "t": 218.809, "e": 219.855}, {"text": "What do you mean?", "v": "F", "t": 220.005, "e": 220.965}]}, {"who": "Raven", "sents": [{"text": "He’s here with a woman, so stop your crying!", "v": "F", "t": 221.615, "e": 223.983}]}, {"who": "", "sents": [{"text": "Ebony didn't answer, there was a long quietness until Raven said “Hello”.", "v": "F", "t": 224.633, "e": 228.707}]}, {"who": "Ebony", "sents": [{"text": "I’m here, I’m just having a million thoughts right now! ", "v": "F", "t": 229.357, "e": 232.195}, {"text": "I’m getting dressed, I’ll be there in half an hour.", "v": "F", "t": 232.345, "e": 234.777}]}, {"who": "Raven", "sents": [{"text": "No, nevermind don’t come because he knows we all saw him and it looks as though he’s leaving, he’ll be gone by the time you get here. ", "v": "F", "t": 235.427, "e": 242.616}, {"text": "I’ll call you later in the afternoon, but stop crying, he’s not worth it if he can disregard you like this, without thinking about your feelings.", "v": "F", "t": 242.766, "e": 250.723}]}, {"who": "Ebony", "sents": [{"text": "Yes, please call me she says still crying.", "v": "F", "t": 251.373, "e": 253.635}]}, {"who": "", "sents": [{"text": "Ebony hangs up and tries his phone again. ", "v": "F", "t": 254.285, "e": 256.61}, {"text": "Of course no answer, he knows by now the girls have called me. ", "v": "F", "t": 256.76, "e": 260.173}, {"text": "She leaves him a message calling him every curse word she can think of and hangs up! ", "v": "F", "t": 260.323, "e": 264.974}, {"text": "She walks to her chair and sits down, he will eventually call me and I can’t wait to hear his excuse. ", "v": "F", "t": 265.124, "e": 270.756}, {"text": "Ebony’s so angry, her heart is beating fast and she feels a headache approaching. ", "v": "F", "t": 270.906, "e": 275.258}, {"text": "Well, I might as well take something and go to bed. ", "v": "F", "t": 275.408, "e": 278.117}, {"text": "The buzzing of her phone alarm awakens her. ", "v": "F", "t": 278.267, "e": 280.507}, {"text": "Holy crap! ", "v": "F", "t": 280.657, "e": 281.553}, {"text": "It’s 8a, Saturday morning, she was supposed to open the Hair Salon that she owns at 7:30a. ", "v": "F", "t": 281.703, "e": 288.487}, {"text": "She knew she wouldn't be able to be at work crying and not giving her clients her all. ", "v": "F", "t": 288.637, "e": 293.053}, {"text": "So she called her assistant and told her she had an emergency and couldn't make it in to cancel her clients appointment or take whichever ones she thinks she can handle.", "v": "F", "t": 293.203, "e": 302.355}]}, {"who": "", "sents": [{"text": "Raven called right after. ", "v": "F", "t": 303.005, "e": 304.499}, {"text": "Personally, I don’t know how Raven always gets up so early after hanging out but she does. ", "v": "F", "t": 304.649, "e": 309.705}, {"text": "And right now, I’m so happy she’s dependable because I need to rant and rave.", "v": "F", "t": 309.855, "e": 314.441}]}, {"who": "Ebony", "sents": [{"text": "Hi Raven, she says sadly, sniffling. ", "v": "F", "t": 315.091, "e": 317.438}, {"text": "I hope you girls had a good time last night.", "v": "F", "t": 317.588, "e": 319.871}]}, {"who": "Raven", "sents": [{"text": "It was alright, too crowded but the music was good. ", "v": "F", "t": 320.521, "e": 323.315}, {"text": "We haven't been home yet. ", "v": "F", "t": 323.465, "e": 324.831}, {"text": "We stopped at a diner. ", "v": "F", "t": 324.981, "e": 326.303}, {"text": "But how are you this morning?", "v": "F", "t": 326.453, "e": 327.84}]}, {"who": "Ebony", "sents": [{"text": "You girls been up all night? ", "v": "F", "t": 328.49, "e": 330.005}, {"text": "I’m okay. ", "v": "F", "t": 330.155, "e": 331.029}, {"text": "I really thought he liked me and we had a good thing going, she says as her voice cracks.", "v": "F", "t": 331.179, "e": 336.001}]}, {"who": "Raven", "sents": [{"text": "He doesn't deserve you Ebony. ", "v": "F", "t": 336.651, "e": 338.208}, {"text": "Listen, Scarlett and I will be there soon, see you then, love you.", "v": "F", "t": 338.358, "e": 341.707}]}, {"who": "Ebony", "sents": [{"text": "Okay Raven, thank you, love you.", "v": "F", "t": 342.357, "e": 344.32}]}, {"who": "", "sents": [{"text": "Raven and Scarlett arrive at Ebony’s apartment. ", "v": "F", "t": 344.97, "e": 347.765}, {"text": "She answers the door looking like a hot mess! ", "v": "F", "t": 347.915, "e": 350.261}, {"text": "Two hair rollers in her hair, still with her robe on, eyes red and swollen. ", "v": "F", "t": 350.411, "e": 354.571}, {"text": "Poor thing, thinks Raven, I was so happy that she had been dating Cree.", "v": "F", "t": 354.721, "e": 358.625}]}, {"who": "Raven", "sents": [{"text": "Girl! ", "v": "F", "t": 359.275, "e": 360.001}, {"text": "Raven says as Ebony holds the door open wide for them to enter. ", "v": "F", "t": 360.151, "e": 364.033}, {"text": "Scarlett and Raven look at each other, not sure what to say. ", "v": "F", "t": 364.183, "e": 367.298}, {"text": "Ebony is Raven’s long time friend. ", "v": "F", "t": 367.448, "e": 369.539}, {"text": "Scarlett is fairly new to the friendship but they hug Ebony at the same time, then Ebony really lets out the tears!", "v": "F", "t": 369.689, "e": 376.494}]}, {"who": "", "sents": [{"text": "All of them are talking at once, “he’s not worth your tears, he’s a bum, he’s so stupid” and Ebony is hugging them back nodding her head.", "v": "F", "t": 377.144, "e": 384.696}]}, {"who": "", "sents": [{"text": "Scarlett holds up a bottle! ", "v": "F", "t": 385.346, "e": 386.925}, {"text": "Wine! ", "v": "F", "t": 387.075, "e": 387.757}, {"text": "It’s never too early, let’s sit down and talk. ", "v": "F", "t": 387.907, "e": 390.382}, {"text": "They pile into Ebony's bedroom and sit. ", "v": "F", "t": 390.532, "e": 392.751}, {"text": "Ebony goes to get glasses, she feels like drinking out of the bottle she thinks to herself. ", "v": "F", "t": 392.901, "e": 397.829}, {"text": "Walking back to the bedroom, she sits on the floor, crying again and reaching for the tissues she asks “so how did that heifer look”?", "v": "F", "t": 397.979, "e": 405.339}]}, {"who": "Scarlett", "sents": [{"text": "She had nothing on you! ", "v": "F", "t": 405.989, "e": 407.354}, {"text": "Nothing at all! ", "v": "F", "t": 407.504, "e": 408.549}, {"text": "He’s crazy!", "v": "F", "t": 408.699, "e": 409.681}]}, {"who": "Raven", "sents": [{"text": "She looked like a tall amazon woman with muscles, had the nerve to have two curly pom-poms in her hair!", "v": "F", "t": 410.331, "e": 416.112}]}, {"who": "Scarlett", "sents": [{"text": "You're beautiful, and not to bash another woman but she was not.", "v": "F", "t": 416.762, "e": 420.133}]}, {"who": "Ebony", "sents": [{"text": "Thanks ladies but I know you're only trying to make me feel better.", "v": "F", "t": 420.783, "e": 424.217}]}, {"who": "Raven", "sents": [{"text": "No, we are telling you the truth! ", "v": "F", "t": 424.867, "e": 426.659}, {"text": "She had big eyes, a big nose, she was just big!", "v": "F", "t": 426.809, "e": 429.54}]}, {"who": "", "sents": [{"text": "They start describing the scene they saw, Cree sitting close to the woman very intimately, comfortably like he really knew her for a while. ", "v": "F", "t": 430.19, "e": 437.699}, {"text": "Maybe they were sitting that close so they could hear each other over the music Scarlett says, always wanting everything to be smooth. ", "v": "F", "t": 437.849, "e": 444.953}, {"text": "And that before he saw them, they had seen him dancing with her, she was dancing suggestively. ", "v": "F", "t": 445.103, "e": 450.159}, {"text": "They didn't hold any details back although they knew it would hurt her, it was best she knew it all.", "v": "F", "t": 450.309, "e": 454.896}]}, {"who": "", "sents": [{"text": "They weren't there for an hour when her doorbell rang. ", "v": "F", "t": 455.546, "e": 458.042}, {"text": "She looked at them and went to the door looking through the peephole.", "v": "F", "t": 458.192, "e": 461.371}]}, {"who": "Ebony", "sents": [{"text": "“It’s Cree” she whispered looking back at them. ", "v": "F", "t": 462.021, "e": 464.239}, {"text": "“What should I do? ", "v": "F", "t": 464.389, "e": 465.435}, {"text": "I look like a mess!” ", "v": "F", "t": 465.585, "e": 466.822}, {"text": "She asked.", "v": "F", "t": 466.972, "e": 467.889}]}, {"who": "Raven", "sents": [{"text": "Open the door, let him in, the no good bastard.", "v": "F", "t": 468.539, "e": 471.291}]}, {"who": "Scarlett", "sents": [{"text": "I’m gonna curse him out!", "v": "F", "t": 471.941, "e": 473.307}]}, {"who": "Raven", "sents": [{"text": "No one is cursing him out but Ebony! ", "v": "F", "t": 473.957, "e": 475.983}, {"text": "As a matter of fact, I think we should leave and let them talk if Ebony doesn’t feel threatened by him, she said looking at Ebony for confirmation.", "v": "F", "t": 476.133, "e": 484.048}]}, {"who": "Ebony", "sents": [{"text": "He’s a liar not a woman beater or anything. ", "v": "F", "t": 484.698, "e": 487.322}, {"text": "Yeah, y’all can leave, I’ll call you as soon as I can. ", "v": "F", "t": 487.472, "e": 490.331}, {"text": "If you stay he’s not going to stay and I want to hear his excuses.", "v": "F", "t": 490.481, "e": 494.171}]}, {"who": "", "sents": [{"text": "Raven hesitated but begrudgingly agreed. ", "v": "F", "t": 494.821, "e": 497.445}, {"text": "Ebony opened the door and they both exited, pushing past him as he was saying hello to them, very low and shameful. ", "v": "F", "t": 497.595, "e": 504.529}, {"text": "They didn't acknowledge him. ", "v": "F", "t": 504.679, "e": 506.044}, {"text": "Ebony took a deep breath, straightened her back and told him to come in…", "v": "F", "t": 506.194, "e": 509.821}]}, {"who": "", "sents": [{"text": "Cree walked into Ebony’s apartment with his head down, guilt exuding from him, holding a bouquet of flowers. ", "v": "M", "t": 510.671, "e": 516.815}, {"text": "As soon as she closed the door he lifted his head and stared at her waiting for her to start yelling at him. ", "v": "M", "t": 516.965, "e": 522.703}, {"text": "She didn't though, she stood there quietly waiting for him to start talking. ", "v": "M", "t": 522.853, "e": 526.885}, {"text": "After an awkward silence of a minute, which to Cree seemed like a half hour, he decided to start talking.", "v": "M", "t": 527.035, "e": 533.094}]}, {"who": "Cree", "sents": [{"text": "Ebony, may we sit? ", "v": "M", "t": 533.744, "e": 535.493}, {"text": "She nodded her head yes.", "v": "M", "t": 535.643, "e": 537.585}]}, {"who": "Ebony", "sents": [{"text": "She was surprised at her calmness. ", "v": "F", "t": 538.435, "e": 540.227}, {"text": "I need to change into some clothes, be right back. ", "v": "F", "t": 540.377, "e": 543.15}, {"text": "Ebony knew having him wait would make him suffer, not knowing what she was thinking or how she would act towards him.", "v": "F", "t": 543.3, "e": 549.615}]}, {"who": "", "sents": [{"text": "She returned to the living room, once again, dressed in a sweatsuit. ", "v": "F", "t": 550.265, "e": 554.019}, {"text": "When she sat on the sofa, he tried handing her the flowers. ", "v": "F", "t": 554.169, "e": 557.263}, {"text": "They were beautiful white roses but she didn't reach for them, so he continued to hold them.", "v": "F", "t": 557.413, "e": 562.042}]}, {"who": "Cree", "sents": [{"text": "He put his hand on her knee, I’m so sorry I didn't call you to let you know my plans changed. ", "v": "M", "t": 562.892, "e": 568.076}, {"text": "An old friend of mine called me crying that she needed to talk to someone, she was going through some things with her boyfriend. ", "v": "M", "t": 568.226, "e": 574.775}, {"text": "She asked if I could meet her at Limelight. ", "v": "M", "t": 574.925, "e": 577.613}, {"text": "I agreed and the next thing you know, it was so late. ", "v": "M", "t": 577.763, "e": 581.049}, {"text": "We had a couple of drinks and danced and then I put her in a cab and here I am. ", "v": "M", "t": 581.199, "e": 585.721}, {"text": "I knew Raven and Scarlett were there watching my every move.", "v": "M", "t": 585.871, "e": 589.626}]}, {"who": "Ebony", "sents": [{"text": "So you didn't think to call me, knowing I would be worried something happened to you she shouted! ", "v": "F", "t": 590.476, "e": 595.063}, {"text": "Cree! ", "v": "F", "t": 595.213, "e": 595.874}, {"text": "I thought you were hurt! ", "v": "F", "t": 596.024, "e": 597.24}, {"text": "How dare you show up here claiming you weren't with her long! ", "v": "F", "t": 597.39, "e": 600.099}, {"text": "It’s been all night!", "v": "F", "t": 600.249, "e": 601.401}]}, {"who": "", "sents": [{"text": "Cree interrupted Ebony, claiming he went to a diner alone to gather his thoughts before going to her house because he knew he had some serious explaining to do.", "v": "M", "t": 602.251, "e": 610.955}]}, {"who": "Cree", "sents": [{"text": "Like I said, “I knew Raven and Scarlett saw me and would tell you I was there with someone, so I prolonged seeing you. ", "v": "M", "t": 611.605, "e": 617.941}, {"text": "Please believe me, I know I messed up terribly, and I’m sorry for scaring you. ", "v": "M", "t": 618.091, "e": 622.721}, {"text": "Ebony, I really like you but sometimes you can be too intense, too expectant. ", "v": "M", "t": 622.871, "e": 627.607}, {"text": "I’ll be honest, it felt a little freeing to talk to Sharon last night. ", "v": "M", "t": 627.757, "e": 631.725}, {"text": "There were no expectations, I was there to listen only as a friend and it felt good.", "v": "M", "t": 631.875, "e": 636.781}]}, {"who": "", "sents": [{"text": "Again, I’m so sorry and I hope you can forgive me.", "v": "M", "t": 637.431, "e": 640.823}]}, {"who": "Ebony", "sents": [{"text": "And I’m sorry you feel like I’m smothering you Cree, that was never my intention but you should have talked to me about that.", "v": "F", "t": 641.673, "e": 648.009}]}, {"who": "Cree", "sents": [{"text": "I hope we can get past this and try to move forward with our relationship. ", "v": "M", "t": 648.859, "e": 653.083}, {"text": "I want to be with you, we just need to slow things down.", "v": "M", "t": 653.233, "e": 656.668}]}, {"who": "", "sents": [{"text": "Ebony thought about what he was saying. ", "v": "F", "t": 657.518, "e": 659.417}, {"text": "She was getting ready to say yes, I can do that, but all of a sudden she got angry, remembering how worried she was all night. ", "v": "F", "t": 659.567, "e": 666.671}, {"text": "She shook her head as if clearing her mind! ", "v": "F", "t": 666.821, "e": 669.018}, {"text": "She knew she couldn't trust him anymore and things would only get worse with her questioning his every move.", "v": "F", "t": 669.168, "e": 674.864}]}, {"who": "Ebony", "sents": [{"text": "Shouting at the top of her lungs, she said “you know what Cree, I don’t need you, I definitely don’t need anyone telling me to take it slow when I’m only showing them affection! ", "v": "F", "t": 675.514, "e": 684.837}, {"text": "You had no regard for my feelings, there was no excuse not to call me. ", "v": "F", "t": 684.987, "e": 688.933}, {"text": "I don’t accept your apology, don’t call me anymore, take your cheesy flowers and get the hell out of my house!”", "v": "F", "t": 689.083, "e": 694.822}]}, {"who": "", "sents": [{"text": "Cree tried to interrupt her, he thought his sad excuse would justify his actions. ", "v": "M", "t": 695.672, "e": 700.451}, {"text": "He was saying “Ebony, please don’t do this, we can work it out.” ", "v": "M", "t": 700.601, "e": 704.377}, {"text": "Ebony pushed him towards the door and repeated “I said get the hell out!”", "v": "F", "t": 704.727, "e": 708.652}]}, {"who": "", "sents": [{"text": "He put his hands in front of him to concede, he turned around and once outside the door he said again “Ebony, I’m so sorry, I hope you change your mind.”", "v": "M", "t": 709.502, "e": 717.907}]}, {"who": "", "sents": [{"text": "Ebony slammed the door in his face as he was talking. ", "v": "F", "t": 718.757, "e": 721.701}, {"text": "She was so angry, breathing hard and pacing back and forth! ", "v": "F", "t": 721.851, "e": 725.286}, {"text": "How dare him think she was a fool, that it would be so easy to get back in her good graces. ", "v": "F", "t": 725.436, "e": 730.321}, {"text": "She thought to herself, I have to calm down, I’m glad he made me angry, it snapped me out of my misery! ", "v": "F", "t": 730.471, "e": 736.146}, {"text": "Ha! ", "v": "F", "t": 736.296, "e": 736.936}, {"text": "He’ll want me before I want him! ", "v": "F", "t": 737.086, "e": 738.729}, {"text": "With those thoughts she went to take her shower and call the girls!", "v": "F", "t": 738.879, "e": 741.972}]}, {"who": "", "sents": [{"text": "Walking to his car, Cree knew he didn't handle that right! ", "v": "M", "t": 742.822, "e": 746.193}, {"text": "He became accusatory, blaming her for his behavior. ", "v": "M", "t": 746.343, "e": 749.884}, {"text": "Damn, I royally messed that apology up but I know Ebony and once she calms down she will forgive me. ", "v": "M", "t": 750.034, "e": 756.007}, {"text": "Raven and Scarlett had to open up their big mouths before I could talk to Ebony!", "v": "M", "t": 756.157, "e": 761.021}]}, {"who": "", "sents": [{"text": "Sunday morning, the sun was shining through Raven’s window waking her up. ", "v": "F", "t": 761.871, "e": 765.839}, {"text": "Swaddled in her fluffy white comforter, she turned over to look at the clock, wow, 8:00am, I never sleep this late. ", "v": "F", "t": 765.989, "e": 772.944}, {"text": "It’s good Jericho didn't come over or I would not have gotten any sleep, my man is insatiable and I love it she smiled to herself! ", "v": "F", "t": 773.094, "e": 780.795}, {"text": "Remembering she needed to go to the mall to return some items she wondered if the girls would want to go. ", "v": "F", "t": 780.945, "e": 786.812}, {"text": "Perhaps we can get Ebony to go, take her mind off of that no good Cree! ", "v": "F", "t": 786.962, "e": 790.781}, {"text": "Raven picked up her phone to conference call, calling Scarlett first, then Charli and finally Ebony. ", "v": "F", "t": 790.931, "e": 796.925}, {"text": "She knew it was early but that was good so they could get an early start and have all day to shop. ", "v": "F", "t": 797.075, "e": 802.345}, {"text": "They all agreed to go and enjoy the day.", "v": "F", "t": 802.495, "e": 804.585}]}, {"who": "", "sents": [{"text": "Two hours later, the four of them were in Raven's pink and white Cadillac convertible. ", "v": "F", "t": 805.235, "e": 810.099}, {"text": "The music was playing loudly and all of them were trying to talk over each other, of course about Cree and that whole fiasco. ", "v": "F", "t": 810.249, "e": 817.289}, {"text": "Scarlett was describing to Ebony again how the woman looked.", "v": "F", "t": 817.439, "e": 820.874}]}, {"who": "Scarlett", "sents": [{"text": "Ebony, seriously, she was big! ", "v": "F", "t": 821.524, "e": 823.444}, {"text": "Like everything, even her eyes!", "v": "F", "t": 823.594, "e": 825.514}]}, {"who": "Raven", "sents": [{"text": "I don't want to talk bad about anyone, and I already told you, she has nothing on you girl, you know you are beautiful. ", "v": "F", "t": 826.164, "e": 832.223}, {"text": "It’s Cree's loss and he will soon realize his mistake. ", "v": "F", "t": 832.373, "e": 835.338}, {"text": "Hey, I know this is random and earlier than I planned but since we're all together, let’s check out that new Bridal store across from the mall today. ", "v": "F", "t": 835.488, "e": 843.957}, {"text": "You know, just to get some ideas and then we can bring Jericho’s twin sisters India and Winter and my cousin Brooklyn another day. ", "v": "F", "t": 844.107, "e": 851.979}, {"text": "Scarlett, you will also have to bring Tia for her flower girl dress.", "v": "F", "t": 852.129, "e": 855.756}]}, {"who": "", "sents": [{"text": "All of them agreed, surprisingly, even Ebony got excited. ", "v": "F", "t": 856.406, "e": 859.777}, {"text": "Yes, let's do this, Ebony said happily.", "v": "F", "t": 859.927, "e": 862.423}]}, {"who": "", "sents": [{"text": "The girls did some shopping and are now going to “Belle Robes” which means beautiful dresses in French. ", "v": "F", "t": 863.073, "e": 869.003}, {"text": "They all tried on some dresses, but no final decision was made on any of them without the rest of the Bridal Party.", "v": "F", "t": 869.153, "e": 875.831}]}, {"who": "Scarlett", "sents": [{"text": "That was so much fun, they had nice dresses but now I’m so hungry!", "v": "F", "t": 876.481, "e": 880.299}]}, {"who": "", "sents": [{"text": "Stopping to get lunch, they were sitting in The Cheesecake Factory looking at the menu when Ebony’s cell phone rang, she looked at it, then at them, “It's Cree. ", "v": "F", "t": 880.949, "e": 889.568}, {"text": "I didn't tell y’all but he's been calling all day.” ", "v": "F", "t": 889.718, "e": 892.342}, {"text": "I haven't answered and I'm not going to.", "v": "F", "t": 892.492, "e": 894.753}]}, {"who": "Charli", "sents": [{"text": "Good for you Ebony, he can go kick rocks!", "v": "F", "t": 895.403, "e": 897.75}]}, {"who": "", "sents": [{"text": "They all got quiet and looked at Charli then busted out laughing because Charli is always quiet and never gives her opinion. ", "v": "F", "t": 898.4, "e": 905.781}, {"text": "She shrugged her shoulders saying “well, he's an ass”, they all shook their heads agreeing with her. ", "v": "F", "t": 905.931, "e": 910.859}, {"text": "After eating, It was getting late so they headed to the car to go home.", "v": "F", "t": 911.009, "e": 914.7}]}, {"who": "Raven", "sents": [{"text": "Oh, I have to stop for gas before we get on the highway.", "v": "F", "t": 915.35, "e": 918.465}]}, {"who": "", "sents": [{"text": "Scarlett said pointing “Raven, there's a gas station a block up the road.” ", "v": "F", "t": 919.115, "e": 923.36}, {"text": "Raven pulls into the station and up to the pump. ", "v": "F", "t": 923.51, "e": 926.155}, {"text": "The attendant approaches and Raven tells him what she wants. ", "v": "F", "t": 926.305, "e": 929.505}, {"text": "He walks away and returns immediately, uhm lady, let me show you something he says to Raven. ", "v": "M", "t": 929.855, "e": 935.125}, {"text": "They all get out of the car and he shows Raven that there's sugar packed solid in her gas pipe.", "v": "F", "t": 935.475, "e": 940.467}]}, {"who": "", "sents": [{"text": "Raven screams “oh my goodness!” ", "v": "F", "t": 941.117, "e": 943.037}, {"text": "While Charli's saying what the hell! ", "v": "F", "t": 943.187, "e": 944.893}, {"text": "And Ebony is also yelling “what does this mean?” ", "v": "F", "t": 945.043, "e": 947.753}, {"text": "Scarlett asks the attendant if he can remove it and he said “no, that it was a huge problem and they need to go to a mechanic, sugar in the tank causes engine problems and will kill the car. ", "v": "F", "t": 947.903, "e": 959.295}, {"text": "He said “someone put that there to damage your car permanently.” ", "v": "M", "t": 959.645, "e": 963.485}, {"text": "Raven asked him if she could drive it home 7 miles away. ", "v": "F", "t": 963.835, "e": 967.355}, {"text": "He said “I don’t want to tell you to do that or not miss”.", "v": "M", "t": 967.705, "e": 971.139}]}, {"who": "", "sents": [{"text": "Raven decided to call her fiancé Jericho. ", "v": "F", "t": 971.989, "e": 974.848}, {"text": "Crying, she told him what happened, he told her to not drive it, he will call to have it towed to his mechanic and he would go to pick them up.", "v": "F", "t": 974.998, "e": 982.465}]}, {"who": "", "sents": [{"text": "Jericho reached them in thirty minutes. ", "v": "M", "t": 983.315, "e": 985.875}, {"text": "Raven was still crying, he hugged her telling her not to worry he'll take care of everything. ", "v": "M", "t": 986.025, "e": 991.081}, {"text": "They all got in Jericho's car except Scarlett, she called Reign and was waiting for him to arrive. ", "v": "M", "t": 991.231, "e": 996.991}, {"text": "So they sat there waiting with her. ", "v": "M", "t": 997.141, "e": 999.274}, {"text": "Reign got there quickly. ", "v": "M", "t": 999.424, "e": 1001.301}, {"text": "He got out of his car, shook Jericho’s hand and hugged Scarlett. ", "v": "M", "t": 1001.451, "e": 1005.483}, {"text": "He told the girls he was glad they were safe. ", "v": "M", "t": 1005.633, "e": 1008.364}, {"text": "Scarlett got in his car and they all waited for the tow truck to arrive.", "v": "M", "t": 1008.514, "e": 1012.759}]}, {"who": "", "sents": [{"text": "After waiting for what seemed a long time, they were finally able to leave. ", "v": "M", "t": 1013.409, "e": 1017.719}, {"text": "Jericho drove off furious, the anger bubbling up inside but he kept his composure to not upset Raven any more than she already was.", "v": "M", "t": 1017.869, "e": 1025.719}]}, {"who": "Jericho", "sents": [{"text": "Glancing over at Raven while holding her hand, he asked, Baby, did you park in the garage or in the driveway when you got home? ", "v": "M", "t": 1026.369, "e": 1033.473}, {"text": "Through sniffles she said “the driveway.” ", "v": "F", "t": 1033.823, "e": 1035.978}, {"text": "Jericho then said, this was planned, someone came on your property and did this. ", "v": "M", "t": 1036.328, "e": 1040.936}, {"text": "The girls all said at the same time, CREE! ", "v": "F", "t": 1041.286, "e": 1043.483}, {"text": "Jericho asked “why would he want to do that to Raven?”. ", "v": "M", "t": 1043.833, "e": 1046.991}, {"text": "Ebony spoke up first.", "v": "F", "t": 1047.341, "e": 1048.791}]}, {"who": "Ebony", "sents": [{"text": "Because Raven and Scarlett told me he was at Limelight with a woman on Friday. ", "v": "F", "t": 1049.441, "e": 1053.879}, {"text": "He tried to apologize to me yesterday and it didn't go as he suspected. ", "v": "F", "t": 1054.029, "e": 1058.125}, {"text": "I didn't forgive him so he is probably mad at Raven and Scarlett. ", "v": "F", "t": 1058.275, "e": 1061.923}, {"text": "Oh no! ", "v": "F", "t": 1062.073, "e": 1062.862}, {"text": "Scarlett! ", "v": "F", "t": 1063.012, "e": 1063.844}, {"text": "Ebony gasped, we have to call her to check her car!", "v": "F", "t": 1063.994, "e": 1066.618}]}, {"who": "", "sents": [{"text": "Jericho said “if Cree did this, I will fuck him up, he must be out of his mind.” ", "v": "M", "t": 1067.468, "e": 1072.183}, {"text": "Ebony was so upset, she started crying loudly saying she was so sorry! ", "v": "F", "t": 1072.533, "e": 1076.671}, {"text": "Jericho told her it is not her fault. ", "v": "M", "t": 1077.021, "e": 1079.731}, {"text": "He asked Charli if she was at Limelight and she said “yes, but I was hanging with Micah and left with him”. ", "v": "M", "t": 1079.881, "e": 1085.683}, {"text": "Jericho quickly looked at Raven, he hated seeing her upset. ", "v": "M", "t": 1085.833, "e": 1089.652}, {"text": "He's going to find out where Cree lives and pay him a visit. ", "v": "M", "t": 1089.802, "e": 1093.258}, {"text": "He called Reign to tell him to make sure he checked Scarlett’s car when they got to her house.", "v": "M", "t": 1093.408, "e": 1098.4}]}, {"who": "Jericho", "sents": [{"text": "Don’t worry baby, he said, squeezing her hand, if the car is totaled, I will buy you a new one. ", "v": "M", "t": 1099.05, "e": 1104.49}, {"text": "Staring ahead, Raven could only nod.", "v": "M", "t": 1104.64, "e": 1107.264}]}, {"who": "", "sents": [{"text": "On Monday, early afternoon, Cree woke up to his doorbell ringing. ", "v": "M", "t": 1107.914, "e": 1111.839}, {"text": "Oh man, he thought angrily, who is ringing my bell like that?! ", "v": "M", "t": 1111.989, "e": 1115.723}, {"text": "He was irritated because he had to wake up in a few hours to get ready for work. ", "v": "M", "t": 1115.873, "e": 1120.523}, {"text": "Jumping out of bed, he went to the window of his first floor apartment and peeked out just in case it was solicitors, but it wasn't, it was Jericho. ", "v": "M", "t": 1120.673, "e": 1128.652}, {"text": "He thought to himself, what the hell is Jericho doing here and how did he get my address. ", "v": "M", "t": 1128.802, "e": 1133.773}, {"text": "His heart started pounding, his first thought was Ebony, he was immediately nervous, did something happen to Ebony?", "v": "M", "t": 1133.923, "e": 1140.301}]}, {"who": "Cree", "sents": [{"text": "He opened the door swiftly. ", "v": "M", "t": 1140.951, "e": 1143.085}, {"text": "“Hey man, what’s going on? ", "v": "M", "t": 1143.235, "e": 1145.304}, {"text": "What brings you here, is Ebony alright?”", "v": "M", "t": 1145.454, "e": 1148.163}]}, {"who": "Jericho", "sents": [{"text": "Closing the small space between them, he said close to Cree’s face “Cree, don’t bullshit me, we both know why I’m here.”", "v": "M", "t": 1148.813, "e": 1155.512}]}, {"who": "Cree", "sents": [{"text": "Yo’ man, back the hell up! ", "v": "M", "t": 1156.162, "e": 1158.146}, {"text": "Who the fuck do you think you are, stepping to me at my door?!", "v": "M", "t": 1158.296, "e": 1161.688}]}, {"who": "Jericho", "sents": [{"text": "“It’s taking everything in me not to lay my hands on you?! ", "v": "M", "t": 1162.338, "e": 1165.922}, {"text": "Do you think Raven and I wouldn’t find out you put sugar in her gas tank” he said yelling, still in Cree’s personal space. ", "v": "M", "t": 1166.072, "e": 1172.707}, {"text": "You better pray her car isn't totalled.", "v": "M", "t": 1172.857, "e": 1175.417}]}, {"who": "Cree", "sents": [{"text": "What?! ", "v": "M", "t": 1176.067, "e": 1176.963}, {"text": "I don’t know what you are talking about, but I’m not going to say it again, get out of my face! ", "v": "M", "t": 1177.113, "e": 1181.827}, {"text": "I didn't do shit to Raven’s car! ", "v": "M", "t": 1181.977, "e": 1184.388}, {"text": "I like Raven, I would never do anything like that to her! ", "v": "M", "t": 1184.538, "e": 1188.015}, {"text": "He yelled at the top of his lungs, dressed only in his boxers, all disheveled.", "v": "M", "t": 1188.165, "e": 1192.773}]}, {"who": "Jericho", "sents": [{"text": "Her and Scarlett saw you at Club Limelight with another woman and you know they told Ebony. ", "v": "M", "t": 1193.423, "e": 1198.437}, {"text": "The next day her car has sugar in the gas tank, that’s too much of a coincidence.", "v": "M", "t": 1198.587, "e": 1203.323}]}, {"who": "Cree", "sents": [{"text": "“I didn't do it and I sure as hell don’t need to keep saying it or defending myself! ", "v": "M", "t": 1203.973, "e": 1208.943}, {"text": "And that woman is an old friend of mine, nothing at all sexual. ", "v": "M", "t": 1209.093, "e": 1213.04}, {"text": "I’m done with this conversation, I have to get ready for work!” ", "v": "M", "t": 1213.19, "e": 1216.945}, {"text": "He went to slam the door in Jericho’s face but Jericho put his hand on the door. ", "v": "M", "t": 1217.095, "e": 1221.852}, {"text": "Cree looked at it and then at Jericho.", "v": "M", "t": 1222.002, "e": 1224.434}]}, {"who": "Cree", "sents": [{"text": "I don’t have beef with you but this is going to get real ugly if you don’t leave.", "v": "M", "t": 1225.084, "e": 1229.5}]}, {"who": "Jericho", "sents": [{"text": "I’m going to leave but you better hope I don’t find out you’re lying. ", "v": "M", "t": 1230.15, "e": 1233.905}, {"text": "He stared at Cree for a long time and turned and walked away.", "v": "M", "t": 1234.055, "e": 1237.831}]}, {"who": "", "sents": [{"text": "Cree finally slammed the door and walked to his bathroom, talking to himself “he must be out of his damned mind stepping to me like that, luckily for him I didn't have time for this nonsense, there’s no way I’m losing my job for him or anyone. ", "v": "M", "t": 1238.481, "e": 1251.473}, {"text": "Cree stepped into the shower, turning on the water, he wondered how to approach the situation after he got off work. ", "v": "M", "t": 1251.623, "e": 1257.831}, {"text": "The first thing is to convince Ebony he’s innocent about his old friend and Raven’s car.", "v": "M", "t": 1257.981, "e": 1263.143}]}, {"who": "", "sents": [{"text": "As Jericho walked to his car, he felt it in his heart that Cree was telling the truth which brings another problem, who would want to screw his baby over like that? ", "v": "M", "t": 1263.793, "e": 1272.241}, {"text": "Raven is such a swee   }
  const s = e.target.closest('[data-n]'); if (!s) return;
  audio.currentTime = S[+s.dataset.n].t + 0.01; setFollow(true); cur = -1; render();
  if (audio.paused) play();
});

/* ---------- manual page turning ---------- */
const followBtn = $('follow');
function setFollow(v) {
  follow = v; followBtn.hidden = v;
  if (v && cur >= 0 && (!audio.paused || audio.currentTime > 0.05)) {
    const target = Math.floor(pageOf(SEL[cur]) / G.N); if (target !== view) showView(target, true);
  }
}
function turn(d) {
  if (!opened) { if (d > 0) openBook(); return; }
  if (view + d < 0 || view + d >= views) return;
  showView(view + d, true);
  if (!audio.paused) { follow = false; followBtn.hidden = false; }
}
$('prevp').addEventListener('click', () => turn(-1));
$('nextp').addEventListener('click', () => turn(1));
followBtn.addEventListener('click', () => setFollow(true));
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target === cover) return;
  if (e.key === 'ArrowRight') turn(1); else if (e.key === 'ArrowLeft') turn(-1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playBtn.click(); }
});
let tx = 0, ty = 0, tt = 0;
book.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive: true });
book.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - tt < 800) turn(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- boot ---------- */
function relayout() {
  finishTurn();
  const keep = cur >= 0 && (follow || audio.paused) && audio.currentTime > 0.05 ? SEL[cur] : null;
  const firstPage = view * G.N;
  layout();
  views = Math.ceil(pages / G.N);
  const v = keep ? Math.floor(pageOf(keep) / G.N) : Math.min(Math.floor(firstPage / G.N), views - 1);
  applyView(Math.max(0, v));
}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 150); });
audio.addEventListener('loadedmetadata', () => {
  let p = 0; try { p = parseFloat(localStorage.getItem(KEY)) || 0; } catch (e) {}
  if (p > 5 && p < DUR - 5) { audio.currentTime = p; cur = -1; render(); }
});
try {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Ebony: The Club', artist: 'Phillis Brown' });
    navigator.mediaSession.setActionHandler('seekbackward', () => $('back').click());
    navigator.mediaSession.setActionHandler('seekforward', () => $('fwd').click());
  }
} catch (e) {}
setIcon(); setVoice('F');
layout(); applyView(0);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(relayout);
</script>
