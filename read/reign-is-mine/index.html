:root {

const PARAS = [{"who": "", "sents": [{"text": "Reign and Scarlett's Story.", "v": "M", "t": 0.0, "e": 2.027}]}, {"who": "", "sents": [{"text": "Reign is Jericho's childhood friend. ", "v": "M", "t": 3.377, "e": 6.043}, {"text": "Single, a musician, a scholar and a good guy!", "v": "M", "t": 6.193, "e": 9.244}]}, {"who": "", "sents": [{"text": "Reign met Ebony and Scarlett a couple of weeks ago at Raven's pizza party. ", "v": "M", "t": 9.894, "e": 14.63}, {"text": "While Ebony seemed interested in him, Reign wanted to get to know Scarlett. ", "v": "M", "t": 14.78, "e": 19.111}, {"text": "The next day he inquired about her to Jericho. ", "v": "M", "t": 19.261, "e": 22.354}, {"text": "Jericho told him what little he knew about her, that she was a Chef in a prestigious restaurant and that Raven talks about her being single because she is so busy and doesn't make time for herself. ", "v": "M", "t": 22.504, "e": 32.381}, {"text": "Jericho said \"man I was scared you were attracted to Ebony, she's pretty and all but I don't trust her\". ", "v": "M", "t": 32.531, "e": 38.078}, {"text": "He went on to tell Reign how Ebony had a little too much to drink a few weeks ago while visiting Raven and when Raven stepped out of the room Ebony was flirting with him. ", "v": "M", "t": 38.228, "e": 46.847}, {"text": "He thought she was Raven's good friend but she's sneaky. ", "v": "M", "t": 46.997, "e": 50.133}, {"text": "He said he didn't tell his girl anything yet.", "v": "M", "t": 50.283, "e": 53.12}]}, {"who": "", "sents": [{"text": "Reign said \"she's not my type, she was a little too forward and loud.\" ", "v": "M", "t": 53.77, "e": 57.781}, {"text": "But, I do want to take Scarlett out, do you think Raven will give me her telephone number?\" ", "v": "M", "t": 57.931, "e": 62.645}, {"text": "Jericho answered \"I'll ask her tonight.\"", "v": "M", "t": 62.795, "e": 65.419}]}, {"who": "", "sents": [{"text": "Meanwhile, at Raven's house, Ebony is asking Raven what she knows about Reign. ", "v": "F", "t": 66.269, "e": 70.877}, {"text": "Raven said \"he's Jericho's best friend and a gifted musician.\" ", "v": "F", "t": 71.027, "e": 74.761}, {"text": "Okay, but is he a bachelor and is he financially stable?\" ", "v": "F", "t": 74.911, "e": 78.409}, {"text": "Ebony asked. ", "v": "F", "t": 78.559, "e": 79.626}, {"text": "Raven answered, \"Girl! ", "v": "F", "t": 79.776, "e": 81.355}, {"text": "I don't know his finances! ", "v": "F", "t": 81.505, "e": 83.019}, {"text": "And I think he's single. ", "v": "F", "t": 83.169, "e": 84.449}, {"text": "What happened to Cree who you were seeing a month ago? ", "v": "F", "t": 84.599, "e": 87.138}, {"text": "I thought it was getting serious.\" ", "v": "F", "t": 87.288, "e": 88.845}, {"text": "She shrugged, \"I don't get serious with anyone. ", "v": "F", "t": 88.995, "e": 91.491}, {"text": "I just spend more time with certain people than others.\"", "v": "F", "t": 91.641, "e": 94.287}]}, {"who": "Raven", "sents": [{"text": "\"Well, listen Ebony, don't go and try to spend time with Reign if you're not serious because I don't want things getting messy. ", "v": "F", "t": 94.937, "e": 102.339}, {"text": "You know he will be Jericho's best man and you'll also be in the wedding\" I do not want that stress on my wedding day, worrying about any awkwardness between the two of you.\"", "v": "F", "t": 102.489, "e": 111.556}]}, {"who": "Ebony", "sents": [{"text": "Oh girl, you're jumping the gun, I just think he's cute and who knows he may like me.\"", "v": "F", "t": 112.206, "e": 117.241}]}, {"who": "", "sents": [{"text": "Jericho was soon able to get Scarlett's telephone number and give it to Reign. ", "v": "M", "t": 118.091, "e": 122.549}, {"text": "At home, Reign is holding his phone in his hand, nervous to make the call. ", "v": "M", "t": 122.699, "e": 126.881}, {"text": "\"Why am I so nervous? ", "v": "M", "t": 127.031, "e": 128.951}, {"text": "I don't ever get nervous, not even before I play at a concert. ", "v": "M", "t": 129.101, "e": 132.877}, {"text": "It's something about Scarlett that has me continuously thinking about her, a pull I can't explain. ", "v": "M", "t": 133.027, "e": 138.381}, {"text": "She's not the usual woman I'm attracted to, although beautiful, she seems too pure, too innocent, while I don't like loud mouths I do like a little spice. ", "v": "M", "t": 138.531, "e": 146.638}, {"text": "But sometimes it's the quiet ones that are a pleasant surprise. ", "v": "M", "t": 146.788, "e": 150.521}, {"text": "What am I doing, I say to myself, just make the call.\"", "v": "M", "t": 150.671, "e": 154.063}]}, {"who": "", "sents": [{"text": "\"Hello\" Scarlett says, answering her phone. ", "v": "F", "t": 154.913, "e": 157.345}, {"text": "\"Hello Scarlett, this is Reign, I met you at Raven's house, he says hesitantly, I hope you don't mind that I asked for your number\" he says. ", "v": "M", "t": 157.695, "e": 165.247}, {"text": "\"I enjoyed speaking with you for those few minutes,\" he laughed. ", "v": "M", "t": 165.397, "e": 169.045}, {"text": "\"Hi Reign, yes I remember, sure it's okay\" Scarlett says while thinking to herself \"I'm going to kill Raven!\"", "v": "F", "t": 169.395, "e": 175.689}]}, {"who": "Reign", "sents": [{"text": "Scarlett, would you like to meet up for coffee tomorrow?", "v": "M", "t": 176.539, "e": 180.101}]}, {"who": "", "sents": [{"text": "There was a long pause, then Scarlett answered \"uhm Reign, I think you're cool but I'm so busy, I just don't have the time.\"", "v": "F", "t": 180.951, "e": 187.415}]}, {"who": "Reign", "sents": [{"text": "People make time for who they want, come on, give me a half hour.", "v": "M", "t": 188.265, "e": 192.447}]}, {"who": "", "sents": [{"text": "Immediately he started thinking, wait does it sound like I'm begging because a brother doesn't do that! ", "v": "M", "t": 193.097, "e": 198.579}, {"text": "He was getting ready to say maybe another time but she answered \"okay but I only have thirty minutes.\" ", "v": "M", "t": 198.729, "e": 204.361}, {"text": "They discussed the time and place to meet and hung up. ", "v": "M", "t": 204.511, "e": 207.647}, {"text": "Reign let out a sigh of relief, excited for the next day.", "v": "M", "t": 207.797, "e": 211.403}]}, {"who": "", "sents": [{"text": "The following day the two of them met at Starbucks. ", "v": "M", "t": 212.053, "e": 215.061}, {"text": "Reign was there ahead of time, he hates being late for anything and he was happy he was the first to arrive. ", "v": "M", "t": 215.211, "e": 221.077}, {"text": "From where he was sitting, he could see Scarlett as she approached the doors, she was so adorable and sexy at the same time. ", "v": "M", "t": 221.227, "e": 227.691}, {"text": "He thought \"I need to get a hold of myself, so I don't act like a rambling idiot.\" ", "v": "M", "t": 227.841, "e": 232.236}, {"text": "He stood up as she approached the table and kissed her cheek. ", "v": "M", "t": 232.386, "e": 235.671}, {"text": "\"Hello\" Reign said, smiling and pulling out her chair. ", "v": "M", "t": 235.821, "e": 239.149}, {"text": "\"Hi there,\" Scarlett answered. ", "v": "M", "t": 239.299, "e": 241.39}, {"text": "\"Are you hungry or do you just want coffee?\" ", "v": "M", "t": 241.54, "e": 244.335}, {"text": "Reign asked. ", "v": "M", "t": 244.485, "e": 245.679}, {"text": "\" I could eat a little something.\" ", "v": "M", "t": 245.829, "e": 247.899}, {"text": "They both ordered a coffee with an egg salad sandwich with Reign being a vegetarian.", "v": "M", "t": 248.049, "e": 252.891}]}, {"who": "", "sents": [{"text": "They talked while eating, asking questions about each other until it was time for Scarlett to leave. ", "v": "M", "t": 253.541, "e": 259.216}, {"text": "\"I'm sorry Reign, I really have to go get ready for work.\" ", "v": "F", "t": 259.566, "e": 262.51}, {"text": "\"I understand Scarlett, thank you for meeting me today, hopefully we can do this again soon\" Reign answered standing. ", "v": "M", "t": 262.86, "e": 269.345}, {"text": "\"Do you need a ride?\" he asked. ", "v": "M", "t": 269.495, "e": 271.565}, {"text": "\"No, my car is right outside but thank you for asking.\" ", "v": "F", "t": 271.915, "e": 275.115}, {"text": "They walked out together, he gave her a brief hug and she walked away.", "v": "M", "t": 275.465, "e": 279.198}]}, {"who": "", "sents": [{"text": "They're meeting at Starbucks was a success yesterday as far as Scarlett was concerned. ", "v": "F", "t": 280.048, "e": 284.784}, {"text": "She sat in her bathtub thinking of her coffee date with Reign. ", "v": "F", "t": 284.934, "e": 288.113}, {"text": "I get a fluttering in my stomach when I think of him. ", "v": "F", "t": 288.263, "e": 290.844}, {"text": "If I'm honest with myself, I did enjoy spending that short time with him. ", "v": "F", "t": 290.994, "e": 295.197}, {"text": "I enjoyed the ease of our conversation, it was so natural, pleasant and light, I felt so comfortable. ", "v": "F", "t": 295.347, "e": 301.448}, {"text": "Not to mention, I liked looking at his lips when he talked! ", "v": "F", "t": 301.598, "e": 304.798}, {"text": "And he smelled so good. ", "v": "F", "t": 304.948, "e": 306.249}, {"text": "I just wanted to bury my nose against his throat when he kissed me briefly on the cheek hello. ", "v": "F", "t": 306.399, "e": 311.263}, {"text": "I love when a man smells so delicious with an expensive cologne.", "v": "F", "t": 311.413, "e": 315.232}]}, {"who": "", "sents": [{"text": "It's been a long time for a sister, that's all, that's why I'm feeling all attracted to him. ", "v": "F", "t": 315.882, "e": 320.725}, {"text": "I'm gonna have to pull out my pink friend tonight, I better make sure it's charged before I leave for work. ", "v": "F", "t": 320.875, "e": 326.123}, {"text": "I wonder what those full lips would feel like on...", "v": "F", "t": 326.273, "e": 328.662}, {"text": "Oh No, there I go again! ", "v": "F", "t": 328.812, "e": 330.305}, {"text": "Yes, I better make sure my friend is charged, she said laughing to herself.", "v": "F", "t": 330.455, "e": 334.423}]}, {"who": "", "sents": [{"text": "Reign is sitting on the side of his bed thinking about Scarlett, that he genuinely likes her, she's so sweet. ", "v": "M", "t": 335.273, "e": 340.948}, {"text": "She has beautiful hazel eyes that he could look into for hours. ", "v": "M", "t": 341.098, "e": 344.895}, {"text": "But right now \"I have to get myself together, and practice for my upcoming concert! ", "v": "M", "t": 345.045, "e": 349.739}, {"text": "As he stands up a notification goes off on his phone. ", "v": "M", "t": 349.889, "e": 353.345}, {"text": "It's a friend request on facebook, Ebony. ", "v": "M", "t": 353.495, "e": 356.417}, {"text": "\"Ebony, Raven's so called friend\" he says to himself. ", "v": "M", "t": 356.567, "e": 359.981}, {"text": "\"I'm not going to even acknowledge that request by denying or accepting, she'll get the hint that I am not interested. ", "v": "M", "t": 360.131, "e": 366.765}, {"text": "Whistling, satisfied with his decision he strolled to the bathroom, ready to get his day started.", "v": "M", "t": 366.915, "e": 372.419}]}, {"who": "", "sents": [{"text": "Scarlett, Raven and Ebony met up at Raven's house to discuss bachelorette party planning. ", "v": "F", "t": 373.269, "e": 378.859}, {"text": "Scarlett was excited to share her feelings about Reign with the girls. ", "v": "F", "t": 379.009, "e": 382.742}, {"text": "She wanted them to know she had been seeing him for a few weeks and was thinking about taking it to the next level. ", "v": "F", "t": 382.892, "e": 388.588}, {"text": "Raven said to Scarlett \"I'm so happy for you, it's about time you are taking time for yourself. ", "v": "F", "t": 388.738, "e": 394.114}, {"text": "Ebony looked at Scarlett and said \"Scarlett, I didn't know you're seeing Reign\". ", "v": "F", "t": 394.264, "e": 398.04}, {"text": "Raven looked a little uncomfortable, she knew Ebony was interested in getting to know him.", "v": "F", "t": 398.19, "e": 402.649}]}, {"who": "", "sents": [{"text": "She said \"Ebony, are you still interested in Cree? ", "v": "F", "t": 403.299, "e": 406.029}, {"text": "He sounded like a really nice guy from your description\".", "v": "F", "t": 406.179, "e": 409.059}]}, {"who": "", "sents": [{"text": "Ebony answered, \"I guess so, he's okay, we'll see\" lying through her teeth,", "v": "F", "t": 409.709, "e": 413.549}]}, {"who": "", "sents": [{"text": "she knew she wasn't interested in Cree, she had Reign on her mind.", "v": "F", "t": 414.199, "e": 417.613}]}, {"who": "", "sents": [{"text": "Ebony was so upset at the moment, crazed with envy. ", "v": "F", "t": 418.263, "e": 421.164}, {"text": "She thought to herself \"I have to work quickly, he's mine Scarlett, Reign is mine\" with that thought she was putting her plan into action. ", "v": "F", "t": 421.314, "e": 428.866}, {"text": "Making an excuse to leave, she ran out the door with renewed energy, she knew what she needed to do!", "v": "F", "t": 429.016, "e": 434.328}]}, {"who": "", "sents": [{"text": "Thanks to the internet, no one's information is private! ", "v": "F", "t": 434.978, "e": 438.071}, {"text": "Later, that evening Ebony googled Reign's address. ", "v": "F", "t": 438.221, "e": 440.909}, {"text": "She thought to herself \"if he sees me looking sexy he won't be able to resist me, especially if he's tired. ", "v": "F", "t": 441.059, "e": 447.203}, {"text": "I'll wait by his house until he gets home and then ring his bell.", "v": "F", "t": 447.353, "e": 450.745}]}, {"who": "", "sents": [{"text": "Ebony sat in her car a block away viewing Reign's house. ", "v": "F", "t": 451.395, "e": 454.467}, {"text": "She knew she was nicely hidden, trees lined the block with a little light from the one street lamp a few feet away. ", "v": "F", "t": 454.617, "e": 460.356}, {"text": "She waited over an hour and then, she saw his car pulling into his driveway. ", "v": "F", "t": 460.506, "e": 464.666}, {"text": "She felt a wave of nerves, a moment of clarity came upon her as she thought to herself \"what am I doing?\" ", "v": "F", "t": 464.816, "e": 470.619}, {"text": "The thought left as quickly as it came. ", "v": "F", "t": 470.769, "e": 472.689}, {"text": "Why should I feel guilty about something or someone I want so badly? ", "v": "F", "t": 472.839, "e": 476.593}, {"text": "I deserve happiness, I deserve to be loved too! ", "v": "F", "t": 476.743, "e": 479.431}, {"text": "With those affirmations in her mind, she started the car and drove the short distance up to his house. ", "v": "F", "t": 479.581, "e": 485.235}, {"text": "She didn't want to give him too much time to get settled and get on the phone with anyone, Scarlett in particular. ", "v": "F", "t": 485.385, "e": 491.081}, {"text": "Ugh! ", "v": "F", "t": 491.231, "e": 491.849}, {"text": "She gets me so sick with her goody two shoes innocent persona.", "v": "F", "t": 491.999, "e": 495.541}]}, {"who": "", "sents": [{"text": "Parking in his driveway behind his car, she thought back to the pool party, I know I looked better than her in my swimsuit! ", "v": "F", "t": 496.191, "e": 502.633}, {"text": "And Scarlett knew Reign was looking at her the whole time and she was acting so shy it was sickening. ", "v": "F", "t": 502.783, "e": 508.031}, {"text": "It was great a few days earlier, Jericho and Reign saw Cree and I out at the Pool Hall, that was perfect timing. ", "v": "F", "t": 508.181, "e": 514.475}, {"text": "I'm sure he told Raven and it certainly will throw everyone off of my intentions towards Reign. ", "v": "F", "t": 514.625, "e": 519.851}, {"text": "I also saw him checking me out at the white party. ", "v": "F", "t": 520.001, "e": 522.561}, {"text": "My dress had fit like a glove, I knew that I looked sexy and that's why I made my way over to him as soon as Scarlett stepped away and Raven and Jericho were in their own world. ", "v": "F", "t": 522.711, "e": 532.717}, {"text": "I love Raven but sometimes her and Jericho are ridiculously in their bubble of love. ", "v": "F", "t": 532.867, "e": 537.773}, {"text": "Wait, if I... no, when I have Reign to myself I guess I will be the same way she giggled to herself. ", "v": "F", "t": 537.923, "e": 543.833}, {"text": "He looked so good all in white, his chocolate skin against the bright white shirt was so intoxicating.", "v": "F", "t": 543.983, "e": 549.572}]}, {"who": "", "sents": [{"text": "Reign is about five-eleven with thick muscular arms, a flat belly, and eyes that are a deep, rich brown. ", "v": "F", "t": 550.222, "e": 556.558}, {"text": "They're intelligent and perceptive.  ", "v": "F", "t": 556.708, "e": 558.5}, {"text": "And his dreadlocks, I absolutely adore!", "v": "F", "t": 558.65, "e": 560.997}]}, {"who": "", "sents": [{"text": "Well, now it's showtime! ", "v": "F", "t": 561.647, "e": 562.927}, {"text": "When he sees what's under my coat he will not be able to resist me. ", "v": "F", "t": 563.077, "e": 566.533}, {"text": "I know I'm attractive with a nice body. ", "v": "F", "t": 566.683, "e": 568.88}, {"text": "I'm gonna blow his mind, I just need to get past the doorway and inside, then it's on and poppin' , she said to herself laughing out loud.", "v": "F", "t": 569.03, "e": 576.774}]}, {"who": "", "sents": [{"text": "Walking up the stairs with beautiful plants on each side of the railings her confidence grew with each step she took, she rang his doorbell. ", "v": "F", "t": 577.424, "e": 584.848}, {"text": "He immediately opened the door, a look of confusion on his face.", "v": "F", "t": 584.998, "e": 588.646}]}, {"who": "Reign", "sents": [{"text": "Ebony, hello, what are you doing here? ", "v": "M", "t": 589.496, "e": 592.248}, {"text": "How did you know where I live?", "v": "M", "t": 592.398, "e": 594.403}]}, {"who": "", "sents": [{"text": "Ebony lied right away.", "v": "F", "t": 595.253, "e": 596.619}]}, {"who": "Ebony", "sents": [{"text": "Oh, I asked Raven for your address. ", "v": "F", "t": 597.269, "e": 599.871}, {"text       rot = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }];
      anims.push(litF.animate([{ opacity: 0 }, { opacity: 0.9, offset: 0.5 }, { opacity: 0.9 }], { duration: dur, easing }));
      finishUp = () => {};
    } else {
      const litF = face(makePage(to, 'r'), false);
      leaf.style.left = '0'; leaf.style.transformOrigin = 'left center';
      rot = [{ transform: 'rotateY(-180deg)' }, { transform: 'rotateY(0deg)' }];
      anims.push(litF.animate([{ opacity: 0.9 }, { opacity: 0.9, offset: 0.5 }, { opacity: 0 }], { duration: dur, easing }));
      finishUp = () => applyView(to);
    }
    cast = add(document.createElement('div')); cast.className = 'cast';
    Object.assign(cast.style, { left: '0', width: pw + 'px', background: 'linear-gradient(to right, rgba(30,18,8,.35), transparent 70%)' });
    anims.push(cast.animate(d > 0 ? [{ opacity: 0.8 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 0.8 }], { duration: dur, easing }));
  } else {
    viewport.style.visibility = 'hidden';
    const oL = from * 2, oR = oL + 1, nL = to * 2, nR = nL + 1;
    const uL = add(makePage(d > 0 ? oL : nL, 'l')); uL.style.left = '0'; uL.style.zIndex = 4;
    const uR = add(makePage(d > 0 ? nR : oR, 'r')); uR.style.left = pw + 'px'; uR.style.zIndex = 4;
    let litF, litB;
    if (d > 0) {
      litF = face(makePage(oR, 'r'), false); litB = face(makePage(nL, 'l'), true);
      leaf.style.left = pw + 'px'; leaf.style.transformOrigin = 'left center';
      rot = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }];
    } else {
      litF = face(makePage(oL, 'l'), false); litB = face(makePage(nR, 'r'), true);
      leaf.style.left = '0'; leaf.style.transformOrigin = 'right center';
      rot = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }];
    }
    anims.push(litF.animate([{ opacity: 0 }, { opacity: 0.85, offset: 0.5 }, { opacity: 0.85 }], { duration: dur, easing }));
    anims.push(litB.animate([{ opacity: 0.85 }, { opacity: 0.85, offset: 0.5 }, { opacity: 0 }], { duration: dur, easing }));
    // shadow the leaf throws on the page it is uncovering, then on the page it lands on
    cast = add(document.createElement('div')); cast.className = 'cast';
    Object.assign(cast.style, { left: (d > 0 ? pw : 0) + 'px', width: pw + 'px', background: `linear-gradient(to ${d > 0 ? 'right' : 'left'}, rgba(30,18,8,.4), transparent 60%)`, zIndex: 5 });
    anims.push(cast.animate([{ opacity: 0.9 }, { opacity: 0, offset: 0.5 }, { opacity: 0 }], { duration: dur, easing }));
    const cast2 = add(document.createElement('div')); cast2.className = 'cast';
    Object.assign(cast2.style, { left: (d > 0 ? 0 : pw) + 'px', width: pw + 'px', background: `linear-gradient(to ${d > 0 ? 'left' : 'right'}, rgba(30,18,8,.4), transparent 60%)`, zIndex: 5 });
    anims.push(cast2.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 0.7, offset: 0.85 }, { opacity: 0 }], { duration: dur, easing }));
    finishUp = () => { applyView(to); viewport.style.visibility = ''; };
  }
  add(leaf);
  const main = leaf.animate(rot, { duration: dur, easing, fill: 'forwards' });
  anims.push(main);
  const done = () => { nodes.forEach(n => n.remove()); finishUp(); };
  turning = { anims, done };
  main.onfinish = () => { if (turning && turning.anims === anims) { turning = null; done(); } };
  view = to; updateLabel();
}
function showView(v, animate) {
  v = Math.max(0, Math.min(views - 1, v));
  if (v === view && !turning) { applyView(v); return; }
  if (animate && opened && !reduce) animateTurn(v); else { finishTurn(); applyView(v); }
  try { localStorage.setItem(KEY + '-view', String(v)); } catch (e) {}
}

/* ---------- the cover ---------- */
function openBook(then) {
  if (opened) { then && then(); return; }
  opened = true; finishTurn();
  book.classList.remove('closed');
  updateLabel();
  const dur = reduce ? 0 : 1300, easing = 'cubic-bezier(.5,.05,.2,1)';
  const fade = G.N === 2 ? [{ opacity: 1 }, { opacity: 1, offset: 0.75 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 0 }];
  const a = cover.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }], { duration: dur, easing, fill: 'forwards' });
  cover.querySelector('.back').animate(fade, { duration: dur, easing: 'linear', fill: 'forwards' });
  if (G.N === 2) book.animate([{ transform: `translateX(${-G.pw / 2}px)` }, { transform: 'translateX(0)' }], { duration: dur, easing });
  book.style.transform = '';
  a.onfinish = () => { cover.hidden = true; then && then(); };
  if (!dur) { cover.hidden = true; then && then(); }
}
cover.addEventListener('click', () => openBook());
cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(); } });

/* ---------- audio sync ---------- */
let cur = -1, follow = true, seeking = false;
function findSent(t) {
  let lo = 0, hi = S.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S[m].t <= t + 0.03) lo = m; else hi = m - 1; }
  return lo;
}
function setVoice(v) {
  $('voicename').textContent = v === 'M' ? 'His voice' : 'Her voice';
  $('voice').querySelector('i').style.background = v === 'M' ? 'var(--gold)' : 'var(--rose)';
}
function render() {
  const t = audio.currentTime;
  $('cur').textContent = fmt(t);
  if (!seeking) $('seek').value = Math.round(1000 * t / (audio.duration || DUR));
  const n = findSent(t);
  if (n !== cur) {
    if (cur >= 0) SEL[cur].classList.remove('on');
    cur = n; setVoice(S[n].v);
    if (!audio.paused || t > 0.05) SEL[n].classList.add('on');
    if (follow && (!audio.paused || t > 0.05)) {
      const target = Math.floor(pageOf(SEL[n]) / G.N);
      if (target !== view) showView(target, true);
    }
  }
}
let raf = 0;
const loop = () => { render(); raf = requestAnimationFrame(loop); };
const playBtn = $('play');
function setIcon() {
  const p = audio.paused;
  $('ico-play').hidden = !p; $('ico-pause').hidden = p;
  playBtn.setAttribute('aria-label', p ? 'Play' : 'Pause');
}
function savePos() { try { localStorage.setItem(KEY, String(audio.currentTime)); } catch (e) {} }
audio.addEventListener('play', () => { setIcon(); setFollow(true); cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause', () => { setIcon(); cancelAnimationFrame(raf); render(); savePos(); });
audio.addEventListener('ended', () => { try { localStorage.removeItem(KEY); } catch (e) {} });
audio.addEventListener('seeked', render);
setInterval(() => { if (!audio.paused) savePos(); }, 5000);

const play = () => audio.play().catch(() => {});
playBtn.addEventListener('click', () => { if (audio.paused) openBook(play); else audio.pause(); });
$('back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); setFollow(true); render(); });
$('fwd').addEventListener('click', () => { audio.currentTime = Math.min(DUR, audio.currentTime + 15); setFollow(true); render(); });
const speeds = [1, 1.25, 1.5, 0.75]; let si = 0;
$('speed').addEventListener('click', e => { si = (si + 1) % speeds.length; audio.playbackRate = speeds[si]; e.currentTarget.textContent = speeds[si] + '×'; });
const seek = $('seek');
seek.addEventListener('input', () => { seeking = true; $('cur').textContent = fmt(seek.value / 1000 * (audio.duration || DUR)); });
seek.addEventListener('change', () => { openBook(); audio.currentTime = seek.value / 1000 * (audio.duration || DUR); seeking = false; setFollow(true); cur = -1; render(); });

flow.addEventListener('click', e => {
  const ch = e.target.closest('[data-ch]');
  if (ch) {
    const c = +ch.dataset.ch;
    audio.currentTime = S[chStartSent[c]].t + 0.01; cur = -1;
    follow = true; followBtn.hidden = true;
    showView(Math.floor(chPage[c] / G.N), true); render();
    return;
  }
  const s = e.target.closest('[data-n]'); if (!s) return;
  audio.currentTime = S[+s.dataset.n].t + 0.01; setFollow(true); cur = -1; render();
  if (audio.paused) play();
});

/* ---------- manual page turning ---------- */
const followBtn = $('follow');
function setFollow(v) {
  follow = v; followBtn.hidden = v;
  if (v && cur >= 0 && (!audio.paused || audio.currentTime > 0.05)) {
    const target = Math.floor(pageOf(SEL[cur]) / G.N); if (target !== view) showView(target, true);
  }
}
function turn(d) {
  if (!opened) { if (d > 0) openBook(); return; }
  if (view + d < 0 || view + d >= views) return;
  showView(view + d, true);
  if (!audio.paused) { follow = false; followBtn.hidden = false; }
}
$('prevp').addEventListener('click', () => turn(-1));
$('nextp').addEventListener('click', () => turn(1));
followBtn.addEventListener('click', () => setFollow(true));
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target === cover) return;
  if (e.key === 'ArrowRight') turn(1); else if (e.key === 'ArrowLeft') turn(-1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playBtn.click(); }
});
let tx = 0, ty = 0, tt = 0;
book.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive: true });
book.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - tt < 800) turn(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- boot ---------- */
function relayout() {
  finishTurn();
  const keep = cur >= 0 && (follow || audio.paused) && audio.currentTime > 0.05 ? SEL[cur] : null;
  const firstPage = view * G.N;
  layout();
  views = Math.ceil(pages / G.N);
  const v = keep ? Math.floor(pageOf(keep) / G.N) : Math.min(Math.floor(firstPage / G.N), views - 1);
  applyView(Math.max(0, v));
}
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 150); });
audio.addEventListener('loadedmetadata', () => {
  let p = 0; try { p = parseFloat(localStorage.getItem(KEY)) || 0; } catch (e) {}
  if (p > 5 && p < DUR - 5) { audio.currentTime = p; cur = -1; render(); }
});
try {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Reign Is Mine', artist: 'Phillis Brown' });
    navigator.mediaSession.setActionHandler('seekbackward', () => $('back').click());
    navigator.mediaSession.setActionHandler('seekforward', () => $('fwd').click());
  }
} catch (e) {}
setIcon(); setVoice('M');
layout(); applyView(0);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(relayout);
</script>
