# Checks the site on every pull request before it can go live (merging to
# main is going live on GitHub Pages): no missing files, no links starting
# with "/", and every page opens at phone and desktop width with no script
# error. The check itself is .github/site-check.cjs.
name: Site check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: Playwright 1.56.1 can't install its browser on Ubuntu 26.04,
    # which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the offline copy's list
        # offline-files.json and version.json must match the files in the repo,
        # or phones keep an older offline copy
        run: node tools/offline.cjs --check
      - name: Check the site
        run: node .github/site-check.cjs "index.html?start=0" read/ebony-the-club/index.html read/reign-is-mine/index.html
      - name: Check the site works without internet
        run: node .github/offline-check.cjs
